<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dependency Graph Task Runner Reader</title>
<style>
:root{
  --bg:#0f1115;--fg:#e6edf3;--mute:#8b949e;--line:#21262d;--card:#161b22;
  --hl-bg:#ffe855;--hl-ink:#1a1c1e;--accent:#58a6ff;--accent-soft:rgba(56,139,253,.15);
  --done:#484f58;--code-bg:#0b0d10;--code-ink:#c9d1d9;--font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;--size:26px
}
*{box-sizing:border-box}
body{margin:0;padding:24px 20px 40vh;background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.55}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:14px 0 12px;margin:0 -20px 24px;padding-left:20px;padding-right:20px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em;color:var(--fg)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;cursor:pointer}
nav button:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-left:auto}
.swatch{width:14px;height:14px;background:var(--hl-bg);border-radius:3px;display:inline-block}
.size{display:flex;gap:4px}
.size button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-family:var(--font-mono);font-size:12px;cursor:pointer}
main{max-width:980px;margin:0 auto}
section.part{margin:40px 0 20px}
section.part>h2{margin:0 0 4px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-family:var(--font-mono)}
section.part>p{margin:0 0 14px;font-size:20px;font-weight:600;color:var(--fg)}
.group{margin:28px 0 10px;font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:18px;padding:16px 12px;border-radius:8px;cursor:pointer;scroll-margin-top:90px}
.row+.row{border-top:1px solid var(--line)}
.time{font-family:var(--font-mono);font-size:15px;color:var(--mute);padding-top:.5em;overflow-wrap:anywhere}
.text{font-size:var(--size);line-height:1.5;max-width:44em;overflow-wrap:break-word}
.text mark.hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:.15em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.row.current{background:var(--accent-soft);border-top-color:transparent}
.row.current .time{color:var(--accent)}
.row.done .text{color:var(--done)}
.row.done .text mark.hl{background:transparent;color:inherit;padding:0}
.row.done .time{color:var(--done)}
.snippet{margin:14px 0 18px;scroll-margin-top:90px}
.snippet .label{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 6px}
.snippet pre{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:4px}.time{padding-top:0}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>

nector line, and typing Yes."}, {"type": "row", "id": 12, "time": "0:00", "action": "Drag a Rectangle from the General section of the shape library panel to the position below the Cycle Detected rhombus.", "text": "I am dragging a Rectangle from the General section of the shape library panel to the position below the Cycle Detected rhombus, to represent calculating in-degrees and building Kahn's ready queue."}, {"type": "row", "id": 13, "time": "0:00", "action": "Double-click inside the rectangle and type Build In-Degrees & Ready Queue.", "text": "I am double-clicking inside the rectangle and typing Build In-Degrees & Ready Queue."}, {"type": "row", "id": 14, "time": "0:00", "action": "Hover over the bottom edge of the Cycle Detected rhombus and click the blue arrow to connect to the Build In-Degrees rectangle. Double-click the line and type No.", "text": "I am clicking the blue arrow on the bottom edge of the Cycle Detected rhombus to connect to the Build In-Degrees rectangle, double-clicking the connector line, and typing No."}, {"type": "row", "id": 15, "time": "0:00", "action": "Drag a Rectangle from the General section of the shape library panel to the position below the Build In-Degrees rectangle.", "text": "I am dragging a Rectangle from the General section of the shape library panel to the position below the Build In-Degrees rectangle, to represent dispatching the next ready job."}, {"type": "row", "id": 16, "time": "0:00", "action": "Double-click inside the rectangle and type Execute Ready Job.", "text": "I am double-clicking inside the rectangle and typing Execute Ready Job."}, {"type": "row", "id": 17, "time": "0:00", "action": "Hover over the bottom edge of the Build In-Degrees rectangle and click the blue arrow to connect to the Execute Ready Job rectangle.", "text": "I am clicking the blue arrow at the bottom of the Build In-Degrees rectangle to connect directly to the Execute Ready Job rectangle."}, {"type": "row", "id": 18, "time": "0:00", "action": "Drag a Rhombus from the General section of the shape library panel to the position below the Execute Ready Job rectangle.", "text": "I am dragging a Rhombus shape from the General section of the shape library panel to the position below the Execute Ready Job rectangle, to check whether the job execution succeeded."}, {"type": "row", "id": 19, "time": "0:00", "action": "Double-click inside the rhombus and type Job Succeeded?.", "text": "I am double-clicking inside the rhombus and typing Job Succeeded?."}, {"type": "row", "id": 20, "time": "0:00", "action": "Hover over the bottom edge of the Execute Ready Job rectangle and click the blue arrow to connect to the Job Succeeded rhombus.", "text": "I am clicking the blue arrow on the bottom edge of the Execute Ready Job rectangle to connect down to the Job Succeeded rhombus."}, {"type": "row", "id": 21, "time": "0:00", "action": "Drag a Rounded Rectangle from the General section of the shape library panel to the left of the Job Succeeded rhombus.", "text": "I am selecting a Rounded Rectangle from the shape library panel on the left and dragging the shape to the left of the Job Succeeded rhombus, to represent marking downstream tasks blocked on failure."}, {"type": "row", "id": 22, "time": "0:00", "action": "Double-click inside the rounded rectangle and type Mark Failed & Block Dependents.", "text": "I am double-clicking inside the rounded rectangle and typing Mark Failed & Block Dependents."}, {"type": "row", "id": 23, "time": "0:00", "action": "Hover over the left edge of the Job Succeeded rhombus and click the blue arrow to connect to the Mark Failed rounded rectangle. Double-click the line and type No.", "text": "I am clicking the blue connector arrow on the left edge of the Job Succeeded rhombus to link to the Mark Failed box, double-clicking the line, and typing No."}, {"type": "row", "id": 24, "time": "0:00", "action": "Drag a Rectangle from the General section of the shape library panel to the position below the Job Succeeded rhombus.", "text": "I am dragging a Rectangle from the General section of the shape library panel to the position below the Job Succeeded rhombus, to represent marking completion and decrementing dependent in-degrees."}, {"type": "row", "id": 25, "time": "0:00", "action": "Double-click inside the rectangle and type Mark Completed & Decrement In-Degrees.", "text": "I am double-clicking inside the rectangle and typing Mark Completed & Decrement In-Degrees."}, {"type": "row", "id": 26, "time": "0:00", "action": "Hover over the bottom edge of the Job Succeeded rhombus and click the blue arrow to connect to the Mark Completed rectangle. Double-click the line and type Yes.", "text": "I am clicking the blue arrow on the bottom edge of the Job Succeeded rhombus to connect to the Mark Completed rectangle, double-clicking the line, and typing Yes."}, {"type": "row", "id": 27, "time": "0:00", "action": "Drag a Rounded Rectangle from the General section of the shape library panel to the bottom center of the canvas.", "text": "I am selecting a Rounded Rectangle from the General section of the shape library panel on the left and dragging the shape to the bottom center of the canvas, to represent returning the completed execution order."}, {"type": "row", "id": 28, "time": "0:00", "action": "Double-click inside the rounded rectangle and type Return Completed Execution Order.", "text": "I am double-clicking inside the rounded rectangle and typing Return Completed Execution Order."}, {"type": "row", "id": 29, "time": "0:00", "action": "Hover over the bottom edge of the Mark Completed rectangle and click the blue arrow to connect to the Return Completed Execution Order rounded rectangle.", "text": "I am clicking the blue connector arrow at the bottom of the Mark Completed rectangle to connect to the Return Completed Execution Order rounded rectangle."}]}, {"name": "Transition to VS Code", "items": [{"type": "row", "id": 30, "time": "0:00", "action": "Click the yellow minimize button in the top-left corner of the Brave browser window.", "text": "The flowchart is complete. I am moving the cursor to the top-left corner of the Brave browser window and clicking the yellow minimize button to minimize Brave."}, {"type": "row", "id": 31, "time": "0:00", "action": "Click the Visual Studio Code icon in the dock on the right edge of the screen.", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the Visual Studio Code icon to bring the project editor to the front."}]}]}, {"part": "PART 2", "title": "VS Code Project Tour", "groups": [{"name": "Project layout", "items": [{"type": "row", "id": 32, "time": "0:00", "action": "Expand the root folder dependency-graph-runner in the Explorer panel on the left.", "text": "In Visual Studio Code, the Explorer panel on the left shows the flat project structure: <span color=\"yellow_bg\">runner.py contains the job models and runner class, test_runner.py contains the pytest unit tests, and README.md documents the usage.</span>"}, {"type": "row", "id": 33, "time": "0:00", "action": "Double-click README.md in the Explorer panel on the left, then move cursor to the editor tab.", "text": "I am double-clicking README.md in the Explorer panel on the left to open the project documentation in the editor on the right."}, {"type": "row", "id": 34, "time": "0:00", "action": "Move the cursor down README.md across the Layout and What is in runner.py sections to line 35.", "text": "Moving the cursor down the editor through the README, <span color=\"yellow_bg\">the document details the JobStatus enum, Job and RunnerStats dataclasses, CycleError exception, and the DependencyGraphRunner class.</span>"}, {"type": "row", "id": 35, "time": "0:00", "action": "Double-click runner.py in the Explorer panel on the left, then move cursor to line 1.", "text": "I am double-clicking runner.py in the Explorer panel on the left to open the core module, and moving the cursor to line 1 in the editor panel."}, {"type": "row", "id": 36, "time": "0:00", "action": "Move the cursor down through the JobStatus enum and Job dataclass on lines 15 to 43.", "text": "Moving the cursor through the existing definitions, <span color=\"yellow_bg\">JobStatus defines PENDING, RUNNING, COMPLETED, FAILED, and BLOCKED. Job holds the action callable, dependencies set, and execution result.</span>"}, {"type": "row", "id": 37, "time": "0:00", "action": "Move the cursor down through the RunnerStats and DependencyGraphRunner initialization on lines 45 to 73.", "text": "Moving the cursor down to line 53, <span color=\"yellow_bg\">DependencyGraphRunner initializes the jobs dictionary, dependencies mapping, and a reentrant lock to ensure thread safety under concurrent queries.</span>"}, {"type": "row", "id": 38, "time": "0:00", "action": "Point at the add_job placeholder on line 81 and the run_order placeholder on line 85.", "text": "Moving the cursor down to line 81, we see the placeholder for add_job, and on line 85, the placeholder for run_order."}]}]}, {"part": "PART 3", "title": "Implement add_job", "groups": [{"name": "Preview and write add_job", "items": [{"type": "code", "label": "Whole method body (reference): add_job, lines 79-99", "code": "79    def add_job(self, job: Job) -> None:\n80        \"\"\"Register a job and validate that it does not introduce a cycle.\"\"\"\n81        if job is None or not job.name:\n82            raise ValueError(\"job and job name cannot be empty\")\n83        with self._lock:\n84            if job.name in self.jobs:\n85                raise ValueError(f\"job '{job.name}' already registered\")\n86            for dep in job.dependencies:\n87                if dep == job.name:\n88                    raise CycleError(f\"Self-dependency detected in job '{job.name}'\")\n89                visited: Set[str] = set()\n90                stack: List[str] = [dep]\n91                while stack:\n92                    curr = stack.pop()\n93                    if curr == job.name:\n94                        raise CycleError(f\"Cycle detected involving '{job.name}' and '{dep}'\")\n95                    if curr not in visited:\n96                        visited.add(curr)\n97                        stack.extend(self.dependencies.get(curr, set()))\n98            self.jobs[job.name] = job\n99            self.dependencies[job.name] = set(job.dependencies)"}, {"type": "row", "id": 39, "time": "0:00", "action": "Move the cursor to line 81 in runner.py and select the raise NotImplementedError placeholder line.", "text": "I am moving the cursor to line 81 in runner.py and selecting the NotImplementedError placeholder inside add_job."}, {"type": "row", "id": 40, "time": "0:00", "action": "Press Command X to remove the placeholder line.", "text": "I am pressing Command X on the keyboard to cut the placeholder line."}, {"type": "row", "id": 41, "time": "0:00", "action": "Type add_job part 1 on lines 81 to 85 (input validation and duplicate registration check under lock).", "text": "I am typing the first part of add_job on lines 81 to 85. <span color=\"yellow_bg\">We validate that the job and job name are not empty, acquire the reentrant lock, and verify that the job identifier is not already registered.</span>"}, {"type": "row", "id": 42, "time": "0:00", "action": "Type add_job part 2 on lines 86 to 97 (depth-first search cycle detection loop).", "text": "I am typing the second part of add_job on lines 86 to 97. <span color=\"yellow_bg\">For each dependency, we check for self-dependencies, then use a depth-first search stack across existing edges to detect any cycle and raise CycleError.</span>"}, {"type": "row", "id": 43, "time": "0:00", "action": "Type add_job part 3 on lines 98 to 99 (registering the job in the dictionary and dependency map).", "text": "I am typing the final part of add_job on lines 98 to 99. <span color=\"yellow_bg\">Once cycle validation passes, we store the job object in the jobs dictionary and record its prerequisite set in the dependencies mapping.</span>"}]}]}, {"part": "PART 4", "title": "Implement run_order", "groups": [{"name": "Preview and write run_order", "items": [{"type": "code", "label": "Whole method body (reference): run_order, lines 101-147", "code": "101    def run_order(self) -> List[str]:\n102        \"\"\"Execute jobs in deterministic topological order and return completed names.\"\"\"\n103        with self._lock:\n104            in_degree: Dict[str, int] = {name: 0 for name in self.jobs}\n105            dependents: Dict[str, Set[str]] = {name: set() for name in self.jobs}\n106            for name, job in self.jobs.items():\n107                for dep in job.dependencies:\n108                    if dep in self.jobs:\n109                        in_degree[name] += 1\n110                        dependents[dep].add(name)\n111\n112            ready: List[str] = sorted([name for name, deg in in_degree.items() if deg == 0])\n113            completed_order: List[str] = []\n114            blocked: Set[str] = set()\n115\n116            while ready:\n117                curr_name = ready.pop(0)\n118                if curr_name in blocked:\n119                    continue\n120                job = self.jobs[curr_name]\n121                job.status = JobStatus.RUNNING\n122                try:\n123                    job.result = job.action()\n124                    job.status = JobStatus.COMPLETED\n125                    completed_order.append(curr_name)\n126                    self._completed += 1\n127                except Exception as exc:\n128                    job.error = exc\n129                    job.status = JobStatus.FAILED\n130                    self._failed += 1\n131                    to_block = list(dependents[curr_name])\n132                    while to_block:\n133                        nxt = to_block.pop()\n134                        if nxt not in blocked:\n135                            blocked.add(nxt)\n136                            self.jobs[nxt].status = JobStatus.BLOCKED\n137                            self._blocked += 1\n138                            to_block.extend(dependents[nxt])\n139                    continue\n140\n141                for nxt in sorted(dependents[curr_name]):\n142                    in_degree[nxt] -= 1\n143                    if in_degree[nxt] == 0 and nxt not in blocked:\n144                        ready.append(nxt)\n145                        ready.sort()\n146\n147            return completed_order"}, {"type": "row", "id": 44, "time": "0:00", "action": "Move the cursor to line 103 in runner.py and select the raise NotImplementedError placeholder line.", "text": "I am moving the cursor down to line 103 in runner.py and selecting the NotImplementedError placeholder inside run_order."}, {"type": "row", "id": 45, "time": "0:00", "action": "Press Command X to cut the placeholder line.", "text": "I am pressing Command X on the keyboard to remove the placeholder line."}, {"type": "row", "id": 46, "time": "0:00", "action": "Type run_order part 1 on lines 103 to 114 (in-degree mapping and initial ready list).", "text": "I am typing the first part of run_order on lines 103 to 114. <span color=\"yellow_bg\">Under the lock, we compute in-degrees and reverse dependent sets for all jobs, and collect all jobs with zero in-degrees sorted alphabetically for deterministic tie-breaking.</span>"}, {"type": "row", "id": 47, "time": "0:00", "action": "Type run_order part 2 on lines 116 to 126 (ready queue execution loop and success handling).", "text": "I am typing the second part of run_order on lines 116 to 126. <span color=\"yellow_bg\">While ready jobs remain, we pop the first job, mark its status RUNNING, execute the action callable, mark it COMPLETED on success, and track completed stats.</span>"}, {"type": "row", "id": 48, "time": "0:00", "action": "Type run_order part 3 on lines 127 to 139 (exception catching and cascading blocked status).", "text": "I am typing the third part of run_order on lines 127 to 139. <span color=\"yellow_bg\">If a job raises an exception, we record the error, mark the job FAILED, and traverse its downstream dependents to mark all transitive tasks BLOCKED.</span>"}, {"type": "row", "id": 49, "time": "0:00", "action": "Type run_order part 4 on lines 141 to 147 (decrementing in-degrees, enqueuing newly ready jobs, and returning execution order).", "text": "I am typing the fourth part of run_order on lines 141 to 147. <span color=\"yellow_bg\">On successful job completion, we decrement the in-degree of all direct dependents, append newly unblocked jobs to the sorted ready queue, and return the completed execution order.</span>"}, {"type": "row", "id": 50, "time": "0:00", "action": "Press Command S to save the file.", "text": "I am pressing Command S on the keyboard to save the changes in runner.py."}]}]}, {"part": "PART 5", "title": "Run the Tests", "groups": [{"name": "Opening terminal and running pytest", "items": [{"type": "row", "id": 51, "time": "0:00", "action": "Click README.md in the editor tab bar to view the test command on line 35.", "text": "I am clicking README.md in the editor tab bar at the top to display the test execution instructions."}, {"type": "row", "id": 52, "time": "0:00", "action": "Select the pytest command on line 35 from start to end with the cursor, and press Command C.", "text": "I am moving the cursor to line 35 in README.md, highlighting the command python3 dash m pytest test_runner.py dash v from start to finish, and pressing Command C to copy the command."}, {"type": "row", "id": 53, "time": "0:00", "action": "Click Terminal in the top menu bar, then click New Terminal to open the terminal panel below.", "text": "I am moving the cursor to the top menu bar, clicking Terminal, and clicking New Terminal to open the integrated terminal panel at the bottom of the window."}, {"type": "row", "id": 54, "time": "0:00", "action": "Click inside the terminal panel, press Command V, and press Enter to execute the test suite.", "text": "I am clicking inside the terminal panel at the bottom, pressing Command V to paste the pytest command, and pressing Enter to run the unit tests."}, {"type": "row", "id": 55, "time": "0:00", "action": "Rest the cursor on the terminal output showing 10 passed in 0.02s.", "text": "The test suite has executed. <span color=\"yellow_bg\">All 10 unit tests have passed, confirming empty graphs, linear chains, diamond topologies, cycle detection, failure blocking, and thread-safe concurrent queries.</span>"}]}]}, {"part": "PART 6", "title": "Epilogue", "groups": [{"name": "Design choices, trade-offs and extensions", "items": [{"type": "row", "id": 56, "time": "0:00", "action": "Stay on the terminal output. No new action.", "text": "<span color=\"yellow_bg\">To summarize the architecture: we built an in-memory dependency graph task runner that guarantees deterministic topological execution while strictly preventing deadlock cycles. Kahn's algorithm provides an optimal O(V + E) scheduling order with sorted ready queues for reproducible tie-breaking. Eager depth-first cycle checks reject circular dependencies at registration time rather than failing midway through execution. Downstream failure cascading ensures unexecutable tasks are cleanly marked BLOCKED while independent branches continue uninterrupted. A reentrant lock guarantees thread safety across concurrent state inspections. For future production scaling, this design cleanly extends to distributed workers with Celery or Redis queues.</span>"}]}]}];

  sec.appendChild(el('h2',null,p.part));sec.appendChild(el('p',null,p.title));
  var b=el('button',null,p.part.replace(/PART /i,'P'));b.setAttribute('aria-label','Go to '+p.part);
  b.onclick=function(){sec.scrollIntoView({behavior:'auto',block:'start'})};nav.appendChild(b);
  p.groups.forEach(function(g){
    sec.appendChild(el('div','group',g.name));
    (g.items||[]).forEach(function(it){
      if(it.type==='code'){
        var sn=el('div','snippet');
        sn.appendChild(el('div','label',it.label));
        var pre=document.createElement('pre');pre.textContent=it.code;
        sn.appendChild(pre);
        sec.appendChild(sn);
        return;
      }
      var r=it;
      var key=p.part+':'+r.id;
      var d=el('div','row');d.tabIndex=0;d.setAttribute('role','button');d.dataset.key=key;
      var timeEl=el('div','time',r.time);
      var textEl=document.createElement('div');textEl.className='text';textEl.innerHTML=r.text.replace(/<span color="yellow_bg">(.*?)<\/span>/g, '<mark class="hl">$1</mark>');
      d.appendChild(timeEl);d.appendChild(textEl);
      d.onclick=function(){toggle(key)};
      d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(key)}};
      sec.appendChild(d);rows.push({k:key,e:d});
    });
  });
  main.appendChild(sec);
});
function paint(){var cur=null;rows.forEach(function(r){var dn=!!done[r.k];r.e.classList.toggle('done',dn);r.e.setAttribute('aria-pressed',dn);r.e.classList.remove('current');if(!dn&&!cur)cur=r});if(cur)cur.e.classList.add('current');return cur}
function toggle(k){done[k]=!done[k];if(!done[k])delete done[k];save();var c=paint();if(done[k]&&c)c.e.scrollIntoView({behavior:'auto',block:'center'})}
document.getElementById('bigger').onclick=function(){size=Math.min(52,size+3);setSize();save()};
document.getElementById('smaller').onclick=function(){size=Math.max(16,size-3);setSize();save()};
document.getElementById('reset').onclick=function(){done={};save();paint();window.scrollTo(0,0)};
var c0=paint();if(c0&&Object.keys(done).length)c0.e.scrollIntoView({behavior:'auto',block:'center'});
</script>
</body>
