<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dependency Graph Task Runner Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#14202B; --mute:#5E6E7B; --line:#D5DDE3;
  --accent:#0B7A75; --accent-soft:#D8EFEC; --done:#9AA8B3;
  --hl-bg:#FCE588; --hl-ink:#3A2E00; --code-bg:#E8EEF1; --code-ink:#1B2A35;
  --font-body:"Atkinson Hyperlegible",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --size:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;flex:1 1 140px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.size{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.legend{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.legend .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--hl-bg)}
main{max-width:1000px;margin:0 auto}
.part{margin-top:36px}
.part>h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 4px}
.part>p{margin:0 0 6px;color:var(--mute);font-size:15px}
.group{margin:26px 0 8px;font-size:15px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:18px;padding:16px 12px;border-radius:8px;cursor:pointer;scroll-margin-top:90px}
.row+.row{border-top:1px solid var(--line)}
.time{font-family:var(--font-mono);font-size:15px;color:var(--mute);padding-top:.5em;overflow-wrap:anywhere}
.text{font-size:var(--size);line-height:1.5;max-width:44em;overflow-wrap:break-word}
.text mark.hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:.15em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.row.current{background:var(--accent-soft);border-top-color:transparent}
.row.current .time{color:var(--accent)}
.row.done .text{color:var(--done)}
.row.done .text mark.hl{background:transparent;color:inherit;padding:0}
.row.done .time{color:var(--done)}
.snippet{margin:14px 0 18px;scroll-margin-top:90px}
.snippet .label{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 6px}
.snippet pre{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:4px}.time{padding-top:0}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>

</header>
<main id="main"></main>
<script>
var DATA=[{"part": "PART 1", "title": "draw.io Flowchart → Switch to VS Code", "groups": [{"name": "Intro – task PDF", "items": [{"type": "row", "id": "1", "time": "0:00–0:20", "text": "I'll be beginning my task soon. Here is the workflow I've in mind. I am clicking the yellow minimize button in the top-left corner of the Preview window to close the task description."}, {"type": "row", "id": "2", "time": "0:20–0:43", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the fifth icon from the top, the red Brave Browser icon just below the divider line, to open draw.io for the flowchart."}]}, {"name": "Draw.io flowchart", "items": [{"type": "row", "id": "3", "time": "0:43–1:18", "text": "draw.io is open in the Brave browser window. On the empty canvas in the middle I will draw the task runner flowchart, using the plain shapes in the General section of the shape library panel on the left, <mark class=\"hl\">showing how jobs are registered, how cycle detection prevents deadlocks, and how Kahn's topological sort executes tasks in dependency order.</mark>"}, {"type": "row", "id": "4", "time": "1:18–1:35", "text": "I am dragging a Rectangle from the General section on the left to the top center of the canvas, to place the entry point where a job is registered."}, {"type": "row", "id": "5", "time": "1:35–1:45", "text": "I am double-clicking inside the rectangle at the top of the canvas and typing Register Job."}, {"type": "row", "id": "6", "time": "1:45–2:01", "text": "I am dragging a Diamond from the General section on the left to the position directly below the Register Job rectangle, to place the cycle check."}, {"type": "row", "id": "7", "time": "2:01–2:19", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Register Job down onto the new diamond, then double-clicking inside the diamond and typing Cycle Detected."}, {"type": "row", "id": "8", "time": "2:19–2:36", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position right of the diamond labelled Cycle Detected, to place the cycle rejection exit."}, {"type": "row", "id": "9", "time": "2:36–3:00", "text": "I am dragging the blue arrow from the right corner of the diamond labelled Cycle Detected onto the new rounded rectangle. I am double-clicking the connector line and typing Yes, then double-clicking inside the rounded rectangle and typing Raise CycleError."}, {"type": "row", "id": "10", "time": "3:00–3:17", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the diamond labelled Cycle Detected, to place the Kahn queue setup step."}, {"type": "row", "id": "11", "time": "3:17–3:42", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled Cycle Detected down onto the new rectangle. I am double-clicking the connector line and typing No, then double-clicking inside the rectangle and typing Build In-Degrees And Ready Queue."}, {"type": "row", "id": "12", "time": "3:42–4:00", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the Build In-Degrees And Ready Queue rectangle, to place the job execution step."}, {"type": "row", "id": "13", "time": "4:00–4:20", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Build In-Degrees And Ready Queue down onto the new rectangle, then double-clicking inside the rectangle and typing Execute Ready Job."}, {"type": "row", "id": "14", "time": "4:20–4:37", "text": "I am dragging a Diamond from the General section on the left to the position directly below the Execute Ready Job rectangle, to check whether the job succeeded."}, {"type": "row", "id": "15", "time": "4:37–4:56", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Execute Ready Job down onto the new diamond, then double-clicking inside the diamond and typing Job Succeeded."}, {"type": "row", "id": "16", "time": "4:56–5:13", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position left of the diamond labelled Job Succeeded, to place the failure blocking step."}, {"type": "row", "id": "17", "time": "5:13–5:39", "text": "I am dragging the blue arrow from the left corner of the diamond labelled Job Succeeded onto the new rounded rectangle. I am double-clicking the connector line and typing No, then double-clicking inside the rounded rectangle and typing Mark Failed And Block Dependents."}, {"type": "row", "id": "18", "time": "5:39–5:55", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the diamond labelled Job Succeeded, to place the completion step."}, {"type": "row", "id": "19", "time": "5:55–6:20", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled Job Succeeded down onto the new rectangle. I am double-clicking the connector line and typing Yes, then double-clicking inside the rectangle and typing Mark Completed And Decrement In-Degrees."}, {"type": "row", "id": "20", "time": "6:20–6:39", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position directly below the Mark Completed And Decrement In-Degrees rectangle, to place the final return step."}, {"type": "row", "id": "21", "time": "6:39–7:01", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Mark Completed And Decrement In-Degrees down onto the final rounded rectangle, then double-clicking inside the rounded rectangle and typing Return Completed Execution Order."}, {"type": "row", "id": "22", "time": "7:01–7:51", "text": "I am clicking on the empty canvas outside the bottom rounded rectangle so the label Return Completed Execution Order is committed, and tracing the flowchart with the cursor from Register Job at the top down to Return Completed Execution Order at the bottom. <mark class=\"hl\">Every newly added job is checked for circular dependencies before joining the graph. During execution, Kahn's algorithm runs zero-in-degree jobs in alphabetical order, decrements dependent in-degrees on success, and cascades a blocked status to downstream dependents whenever a job fails.</mark>"}, {"type": "row", "id": "23", "time": "7:51–8:05", "text": "I am moving the cursor to the top of the draw.io window and clicking the Unsaved changes banner to save the completed flowchart."}, {"type": "row", "id": "24", "time": "8:05–8:23", "text": "I am moving the cursor to the menu bar at the top-left of the draw.io window, clicking File, hovering over Export as, and clicking PNG to export the finished flowchart."}, {"type": "row", "id": "25", "time": "8:23–8:45", "text": "In the Export dialog in the middle of the screen, I am clicking the blue Export button, naming the file final output 2.png in the Save dialog, and clicking Download to save the exported flowchart image."}]}, {"name": "Switch to VS Code", "items": [{"type": "row", "id": "26", "time": "8:45–8:59", "text": "I am moving the cursor to the top-left corner of the Brave Browser window and clicking the yellow minimize button to hide draw.io."}, {"type": "row", "id": "27", "time": "8:59–9:19", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the dock icon for Visual Studio Code, to open the Python project in Visual Studio Code."}]}]}, {"part": "PART 2", "title": "VS Code Project Tour", "groups": [{"name": "Project layout", "items": [{"type": "row", "id": "28", "time": "9:19–9:48", "text": "Visual Studio Code is open, with the Explorer panel on the left and the editor panel on the right. I am moving the cursor to the Explorer panel on the left and clicking the folder arrow to expand the root folder named dependency-graph-runner, which holds runner.py, README.md, and test_runner.py."}, {"type": "row", "id": "29", "time": "9:48–10:11", "text": "<mark class=\"hl\">The project keeps a flat Python layout, with no sub-folders. The implementation sits in runner.py and the test suite sits next to runner.py in test_runner.py, so pytest discovers the tests from the root folder with no extra configuration.</mark>"}]}, {"name": "runner.py: models, helpers, and runner class", "items": [{"type": "row", "id": "30", "time": "10:11–10:28", "text": "I am moving the cursor to runner.py in the Explorer panel on the left and double-clicking runner.py to open the file in the editor panel on the right."}, {"type": "row", "id": "31", "time": "10:28–11:20", "text": "I am moving the cursor from the Explorer panel on the left to the top section of the active editor panel on the right, on the runner.py tab, across lines 17 to 28 for JobStatus and CycleError, and down to lines 31 to 50 for the Job and RunnerStats dataclasses. <mark class=\"hl\">Lines 20 to 24 define the five lifecycle states: PENDING, RUNNING, COMPLETED, FAILED, and BLOCKED. Line 27 defines CycleError, while Job on line 32 and RunnerStats on line 44 hold the job metadata and runner counters.</mark>"}, {"type": "row", "id": "32", "time": "11:20–12:19", "text": "I am moving the cursor to the middle section of the active editor panel on the right, down to line 53 for the DependencyGraphRunner class, across lines 56 to 77 for initialization, stats, and get_job, and down to lines 79 to 117 for the three helper methods _has_path, _build_graph, and _block_from. <mark class=\"hl\">Line 79 defines _has_path, which runs a depth-first search stack to check whether target is reachable from start. Line 92 defines _build_graph, which computes the in_degree counts and reverse dependents sets. Line 103 defines _block_from, which marks all transitive downstream dependents of a failed job as BLOCKED.</mark>"}, {"type": "row", "id": "33", "time": "12:19–13:04", "text": "I am moving the cursor to the bottom section of the active editor panel on the right, down to line 119 for the add_job method with the NotImplementedError placeholder on line 121, and down to line 123 for the run_order method with the NotImplementedError placeholder on line 125. <mark class=\"hl\">Those two methods are the missing pieces: add_job validates and registers jobs while calling _has_path to reject cycles, and run_order executes the graph using _build_graph and _block_from.</mark>"}]}, {"name": "test_runner.py: what the tests expect", "items": [{"type": "row", "id": "34", "time": "13:04–13:21", "text": "I am moving the cursor from the editor panel back to the Explorer panel on the left and double-clicking test_runner.py to open the test suite in the editor panel."}, {"type": "row", "id": "35", "time": "13:21–13:56", "text": "I am moving the cursor to the test_runner.py tab in the editor panel and scrolling down through the test functions from line 10 to line 140. <mark class=\"hl\">The ten unit tests verify empty graphs, linear chains, diamond graphs with alphabetical tie-breaking, self-dependencies, transitive cycles, downstream blocking when an upstream job raises an exception, independent branch execution, and concurrent thread safety.</mark>"}]}]}, {"part": "PART 3", "title": "Write add_job and run_order (38 lines total)", "groups": [{"name": "Writing add_job (10 lines)", "items": [{"type": "code", "label": "Whole method, lines 119-130 (reference, for the indentation)", "code": "119    def add_job(self, job: Job) -> None:\n120        \"\"\"Register a job and validate that it does not introduce a cycle.\"\"\"\n121        if job is None or not job.name:\n122            raise ValueError(\"invalid job\")\n123        with self._lock:\n124            if job.name in self.jobs:\n125                raise ValueError(\"already registered\")\n126            for dep in job.dependencies:\n127                if self._has_path(dep, job.name):\n128                    raise CycleError(\"cycle detected\")\n129            self.jobs[job.name] = job\n130            self.dependencies[job.name] = set(job.dependencies)"}, {"type": "row", "id": "36", "time": "13:56–14:12", "text": "I am moving the cursor back to the Explorer panel on the left and double-clicking runner.py to bring the runner.py tab forward in the editor panel."}, {"type": "row", "id": "37", "time": "14:12–14:34", "text": "I am moving the cursor from the Explorer panel on the left to the bottom section of the active editor panel on the right, on line 121 of runner.py, the raise NotImplementedError placeholder line inside add_job."}, {"type": "code", "label": "Part 1, lines 121-125: validate job input and check duplicate registration under lock", "code": "121        if job is None or not job.name:\n122            raise ValueError(\"invalid job\")\n123        with self._lock:\n124            if job.name in self.jobs:\n125                raise ValueError(\"already registered\")"}, {"type": "row", "id": "38", "time": "14:34–14:53", "text": "I am cutting line 121 with Command X and typing lines 121 to 125 in the bottom section of the active editor panel on the right, the first part of add_job."}, {"type": "row", "id": "39", "time": "14:53–15:31", "text": "I am moving the cursor across lines 121 to 125 in the active editor panel on the right. <mark class=\"hl\">Lines 121 and 122 check whether job is None or job.name is empty, raising a ValueError before taking the lock. Line 123 acquires self._lock, and lines 124 and 125 reject duplicate job names with a ValueError so an existing task in the graph is never overwritten.</mark>"}, {"type": "code", "label": "Part 2, lines 126-130: check _has_path for cycles and store the job", "code": "126            for dep in job.dependencies:\n127                if self._has_path(dep, job.name):\n128                    raise CycleError(\"cycle detected\")\n129            self.jobs[job.name] = job\n130            self.dependencies[job.name] = set(job.dependencies)"}, {"type": "row", "id": "40", "time": "15:31–15:51", "text": "I am moving the cursor down to line 126 in the bottom section of the active editor panel on the right and typing lines 126 to 130, the second and last part of add_job."}, {"type": "row", "id": "41", "time": "15:51–16:40", "text": "I am moving the cursor across lines 126 to 130 in the active editor panel on the right. <mark class=\"hl\">Line 126 loops over each prerequisite dep in job.dependencies. Lines 127 and 128 call self._has_path(dep, job.name), which returns True both for a direct self-dependency and for any transitive path from dep back to job.name, raising CycleError before the graph is modified. Lines 129 and 130 sit outside the for loop to store the validated Job in self.jobs and a copy of job.dependencies in self.dependencies.</mark>"}]}, {"name": "Writing run_order (28 lines)", "items": [{"type": "code", "label": "Whole method, lines 132-161 (reference, for the indentation)", "code": "132    def run_order(self) -> List[str]:\n133        \"\"\"Execute jobs in deterministic topological order and return completed names.\"\"\"\n134        with self._lock:\n135            in_degree, dependents = self._build_graph()\n136            ready = sorted(name for name, deg in in_degree.items() if deg == 0)\n137            completed = []\n138            blocked = set()\n139            while ready:\n140                name = ready.pop(0)\n141                if name in blocked:\n142                    continue\n143                job = self.jobs[name]\n144                job.status = JobStatus.RUNNING\n145                try:\n146                    job.result = job.action()\n147                    job.status = JobStatus.COMPLETED\n148                    completed.append(name)\n149                    self._completed += 1\n150                except Exception as err:\n151                    job.error = err\n152                    job.status = JobStatus.FAILED\n153                    self._failed += 1\n154                    self._block_from(name, dependents, blocked)\n155                    continue\n156                for child in sorted(dependents[name]):\n157                    in_degree[child] -= 1\n158                    if in_degree[child] == 0 and child not in blocked:\n159                        ready.append(child)\n160                        ready.sort()\n161            return completed"}, {"type": "row", "id": "42", "time": "16:40–17:08", "text": "I am moving the cursor in the bottom section of the active editor panel on the right from line 130 down to line 134, the raise NotImplementedError placeholder line inside run_order. Writing add_job shifted the placeholder down by nine lines, from line 125 to line 134."}, {"type": "code", "label": "Part 1, lines 134-138: acquire lock, call _build_graph, and initialize sorted ready queue", "code": "134        with self._lock:\n135            in_degree, dependents = self._build_graph()\n136            ready = sorted(name for name, deg in in_degree.items() if deg == 0)\n137            completed = []\n138            blocked = set()"}, {"type": "row", "id": "43", "time": "17:08–17:27", "text": "I am cutting line 134 with Command X and typing lines 134 to 138 in the bottom section of the active editor panel on the right, the first part of run_order."}, {"type": "row", "id": "44", "time": "17:27–18:06", "text": "I am moving the cursor across lines 134 to 138 in the active editor panel on the right. <mark class=\"hl\">Line 134 acquires self._lock. Line 135 calls self._build_graph to obtain the initial in_degree counts and reverse dependents sets. Line 136 collects all jobs with an in-degree of zero in sorted alphabetical order for deterministic tie-breaking, while lines 137 and 138 initialize the completed list and blocked set.</mark>"}, {"type": "code", "label": "Part 2, lines 139-149: pop next ready job, mark RUNNING, execute action, and record COMPLETED", "code": "139            while ready:\n140                name = ready.pop(0)\n141                if name in blocked:\n142                    continue\n143                job = self.jobs[name]\n144 var main=document.getElementById('main'),nav=document.getElementById('nav');
var done={},size=26,rows=[];
function load(){try{done=JSON.parse(localStorage.getItem('dgtr_done')||'{}');size=+localStorage.getItem('dgtr_size')||26}catch(e){}}
function save(){try{localStorage.setItem('dgtr_done',JSON.stringify(done));localStorage.setItem('dgtr_size',size)}catch(e){}}
function setSize(){document.documentElement.style.setProperty('--size',size+'px')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
load();setSize();
DATA.forEach(function(p,pi){
  var sec=el('section','part');sec.id='part'+(pi+1);
  sec.appendChild(el('h2',null,p.part));sec.appendChild(el('p',null,p.title));
  var b=el('button',null,p.part.replace(/PART /i,'P'));b.setAttribute('aria-label','Go to '+p.part);
  b.onclick=function(){sec.scrollIntoView({behavior:'auto',block:'start'})};nav.appendChild(b);
  p.groups.forEach(function(g){
    sec.appendChild(el('div','group',g.name));
    (g.items||[]).forEach(function(it){
      if(it.type==='code'){
        var sn=el('div','snippet');
        sn.appendChild(el('div','label',it.label));
        var pre=document.createElement('pre');pre.textContent=it.code;
        sn.appendChild(pre);
        sec.appendChild(sn);
        return;
      }
      var r=it;
      var key=p.part+':'+r.id;
      var d=el('div','row');d.tabIndex=0;d.setAttribute('role','button');d.dataset.key=key;
      var timeEl=el('div','time',r.time);
      var textEl=document.createElement('div');textEl.className='text';textEl.innerHTML=r.text;
      d.appendChild(timeEl);d.appendChild(textEl);
      d.onclick=function(){toggle(key)};
      d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(key)}};
      sec.appendChild(d);rows.push({k:key,e:d});
    });
  });
  main.appendChild(sec);
});
function paint(){var cur=null;rows.forEach(function(r){var dn=!!done[r.k];r.e.classList.toggle('done',dn);r.e.setAttribute('aria-pressed',dn);r.e.classList.remove('current');if(!dn&&!cur)cur=r});if(cur)cur.e.classList.add('current');return cur}
function toggle(k){done[k]=!done[k];if(!done[k])delete done[k];save();var c=paint();if(done[k]&&c)c.e.scrollIntoView({behavior:'auto',block:'center'})}
document.getElementById('bigger').onclick=function(){size=Math.min(52,size+3);setSize();save()};
document.getElementById('smaller').onclick=function(){size=Math.max(16,size-3);setSize();save()};
document.getElementById('reset').onclick=function(){done={};save();paint();window.scrollTo(0,0)};
var c0=paint();if(c0&&Object.keys(done).length)c0.e.scrollIntoView({behavior:'auto',block:'center'});
