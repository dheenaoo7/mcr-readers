<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature Flag & Rollout Evaluation Engine Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#14202B; --mute:#5E6E7B; --line:#D5DDE3;
  --accent:#0B7A75; --accent-soft:#D8EFEC; --done:#9AA8B3;
  --hl-bg:#FCE588; --hl-ink:#3A2E00; --code-bg:#E8EEF1; --code-ink:#1B2A35;
  --font-body:"Atkinson Hyperlegible",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --size:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;flex:1 1 140px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.size{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.legend{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.legend .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--hl-bg)}
main{max-width:1000px;margin:0 auto}
.part{margin-top:36px}
.part>h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 4px}
.part>p{margin:0 0 6px;color:var(--mute);font-size:15px}
.group{margin:26px 0 8px;font-size:15px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:18px;padding:16px 12px;border-radius:8px;cursor:pointer;scroll-margin-top:90px}
.row+.row{border-top:1px solid var(--line)}
.time{font-family:var(--font-mono);font-size:15px;color:var(--mute);padding-top:.5em;overflow-wrap:anywhere}
.text{font-size:var(--size);line-height:1.5;max-width:44em;overflow-wrap:break-word}
.text mark.hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:.15em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.row.current{background:var(--accent-soft);border-top-color:transparent}
.row.current .time{color:var(--accent)}
.row.done .text{color:var(--done)}
.row.done .text mark.hl{background:transparent;color:inherit;padding:0}
.row.done .time{color:var(--done)}
.snippet{margin:14px 0 18px;scroll-margin-top:90px}
.snippet .label{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 6px}
.snippet pre{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:4px}.time{padding-top:0}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>

var DATA=[{"part": "PART 1", "title": "draw.io Flowchart → Switch to VS Code", "groups": [{"name": "Intro – task PDF", "items": [{"type": "row", "id": "1", "time": "0:00–0:20", "text": "I'll be beginning my task soon. Here is the workflow I've in mind. I am clicking the yellow minimize button in the top-left corner of the Preview window to close the task description."}, {"type": "row", "id": "2", "time": "0:20–0:43", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the fifth icon from the top, the red Brave Browser icon just below the divider line, to open draw.io for the flowchart."}]}, {"name": "Draw.io flowchart", "items": [{"type": "row", "id": "3", "time": "0:43–1:20", "text": "draw.io is open in the Brave browser window. On the empty canvas in the middle I will draw the feature flag evaluation flowchart, using the plain shapes in the General section of the shape library panel on the left, <mark class=\"hl\">showing how an incoming evaluation checks the global flag state, checks explicit user overrides, and evaluates deterministic percentage rollouts before returning a decision.</mark>"}, {"type": "row", "id": "4", "time": "1:20–1:37", "text": "I am dragging a Rectangle from the General section on the left to the top center of the canvas, to place the entry point where an evaluation request arrives."}, {"type": "row", "id": "5", "time": "1:37–1:47", "text": "I am double-clicking inside the rectangle at the top of the canvas and typing Evaluate Request."}, {"type": "row", "id": "6", "time": "1:47–2:04", "text": "I am dragging a Diamond from the General section on the left to the position directly below the Evaluate Request rectangle, to place the global flag active check."}, {"type": "row", "id": "7", "time": "2:04–2:22", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Evaluate Request down onto the new diamond, then double-clicking inside the diamond and typing Flag Enabled."}, {"type": "row", "id": "8", "time": "2:22–2:39", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position left of the diamond labelled Flag Enabled, to place the disabled return outcome."}, {"type": "row", "id": "9", "time": "2:39–3:03", "text": "I am dragging the blue arrow from the left corner of the diamond labelled Flag Enabled onto the new rounded rectangle. I am double-clicking the connector line and typing No, then double-clicking inside the rounded rectangle and typing Return Disabled."}, {"type": "row", "id": "10", "time": "3:03–3:20", "text": "I am dragging a Diamond from the General section on the left to the position directly below the diamond labelled Flag Enabled, to place the explicit user override check."}, {"type": "row", "id": "11", "time": "3:20–3:45", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled Flag Enabled down onto the new diamond. I am double-clicking the connector line and typing Yes, then double-clicking inside the diamond and typing User In Override List."}, {"type": "row", "id": "12", "time": "3:45–4:05", "text": "I am dragging the blue arrow from the left corner of the diamond labelled User In Override List onto the rounded rectangle labelled Return Disabled, then double-clicking the connector line and typing Blocked."}, {"type": "row", "id": "13", "time": "4:05–4:24", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position right of the diamond labelled User In Override List, to place the enabled return outcome."}, {"type": "row", "id": "14", "time": "4:24–4:49", "text": "I am dragging the blue arrow from the right corner of the diamond labelled User In Override List onto the new rounded rectangle. I am double-clicking the connector line and typing Allowed, then double-clicking inside the rounded rectangle and typing Return Enabled."}, {"type": "row", "id": "15", "time": "4:49–5:08", "text": "I am dragging a Diamond from the General section on the left to the position directly below the diamond labelled User In Override List, to place the percentage rollout bucket check."}, {"type": "row", "id": "16", "time": "5:08–5:33", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled User In Override List down onto the new diamond. I am double-clicking the connector line and typing No, then double-clicking inside the diamond and typing Within Rollout Percentage."}, {"type": "row", "id": "17", "time": "5:33–5:52", "text": "I am dragging the blue arrow from the left corner of the diamond labelled Within Rollout Percentage onto the rounded rectangle labelled Return Disabled, then double-clicking the connector line and typing No."}, {"type": "row", "id": "18", "time": "5:52–6:11", "text": "I am dragging the blue arrow from the right corner of the diamond labelled Within Rollout Percentage onto the rounded rectangle labelled Return Enabled, then double-clicking the connector line and typing Yes."}, {"type": "row", "id": "19", "time": "6:11–7:01", "text": "I am tracing the flowchart with the cursor from Evaluate Request at the top down through Flag Enabled, User In Override List, and Within Rollout Percentage. <mark class=\"hl\">Every flag evaluation first verifies that the flag exists and is globally enabled. Next, explicit user overrides take priority, with blocked users denied before allowed users are granted access. For all other users, the engine hashes the flag name and user identifier into a deterministic bucket from zero to ninety-nine and compares the bucket against the rollout percentage.</mark>"}]}, {"name": "Switch to VS Code", "items": [{"type": "row", "id": "20", "time": "7:01–7:15", "text": "I am moving the cursor to the top-left corner of the Brave Browser window and clicking the yellow minimize button to hide draw.io."}, {"type": "row", "id": "21", "time": "7:15–7:35", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the dock icon for Visual Studio Code, to open the Python project in Visual Studio Code."}]}]}, {"part": "PART 2", "title": "VS Code Project Tour", "groups": [{"name": "Project layout", "items": [{"type": "row", "id": "22", "time": "7:35–8:04", "text": "Visual Studio Code is open, with the Explorer panel on the left and the editor panel on the right. I am moving the cursor to the Explorer panel on the left and clicking the folder arrow to expand the root folder named feature-flag-engine, which holds flags.py, README.md, and test_flags.py."}, {"type": "row", "id": "23", "time": "8:04–8:28", "text": "<mark class=\"hl\">The project keeps a flat Python layout, with no nested sub-folders. The engine implementation sits in flags.py and the test suite sits next to flags.py in test_flags.py, so pytest discovers the tests from the root folder with no extra configuration.</mark>"}]}, {"name": "flags.py: dataclasses, helpers, and engine class", "items": [{"type": "row", "id": "24", "time": "8:28–8:45", "text": "I am moving the cursor to flags.py in the Explorer panel on the left and double-clicking flags.py to open the file in the editor panel on the right."}, {"type": "row", "id": "25", "time": "8:45–9:35", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the flags.py tab, across lines 15 to 23 for the FlagRule dataclass, and down to lines 26 to 33 for the EvaluationStats dataclass. <mark class=\"hl\">Lines 19 to 23 define the FlagRule fields: the flag name, the global enabled boolean defaulting to True, the integer rollout_percentage defaulting to 100, and the allowed_users and blocked_users sets. Lines 30 to 33 define the frozen EvaluationStats fields: total_flags, evaluations, enabled_count, and disabled_count.</mark>"}, {"type": "row", "id": "26", "time": "9:35–10:31", "text": "I am moving the cursor down to line 36, the FeatureFlagEngine class, across lines 39 to 59 for initialization, stats, and get_flag, and down to lines 61 to 74 for the two helper methods _compute_bucket and _record. <mark class=\"hl\">Line 61 defines _compute_bucket, which encodes the flag name and user identifier separated by a colon, computes a SHA-256 hex digest, and takes the integer value modulo one hundred to produce a deterministic bucket from zero to ninety-nine. Line 67 defines _record, which increments total evaluations along with enabled_count or disabled_count and returns the boolean decision.</mark>"}, {"type": "row", "id": "27", "time": "10:31–11:09", "text": "I am moving the cursor down to line 76, the register_flag method with the NotImplementedError placeholder on line 78, and down to line 80, the is_enabled method with the NotImplementedError placeholder on line 82. <mark class=\"hl\">Those two methods are the missing pieces: register_flag validates and stores a FlagRule under self._lock, and is_enabled evaluates global state, user overrides, and the deterministic rollout bucket while recording metrics.</mark>"}]}, {"name": "test_flags.py: what the tests expect", "items": [{"type": "row", "id": "28", "time": "11:09–11:26", "text": "I am moving the cursor from the editor panel back to the Explorer panel on the left and double-clicking test_flags.py to open the test suite in the editor panel."}, {"type": "row", "id": "29", "time": "11:26–12:12", "text": "I am moving the cursor to the test_flags.py tab in the editor panel and scrolling down through the ten test functions from line 13 to line 187. <mark class=\"hl\">The ten unit tests verify unregistered flags, globally disabled flags overriding allowed users, allowed and blocked override precedence, zero and one hundred percent rollouts, deterministic fifty percent rollout consistency, monotonic rollout expansion from twenty-five to seventy-five percent, defensive copying of override sets, invalid input rejection, and multi-threaded concurrency safety.</mark>"}]}]}, {"part": "PART 3", "title": "Write register_flag and is_enabled (20 lines total)", "groups": [{"name": "Writing register_flag (8 lines)", "items": [{"type": "code", "label": "Whole method, lines 76-85 (reference, for the indentation)", "code": "76    def register_flag(self, rule: FlagRule) -> None:\n77        \"\"\"Validate and store a feature flag rule.\"\"\"\n78        if rule is None or not rule.name:\n79            raise ValueError(\"invalid flag rule\")\n80        if rule.rollout_percentage < 0 or rule.rollout_percentage > 100:\n81            raise ValueError(\"invalid rollout percentage\")\n82        with self._lock:\n83            rule.allowed_users = set(rule.allowed_users)\n84            rule.blocked_users = set(rule.blocked_users)\n85            self.flags[rule.name] = rule"}, {"type": "row", "id": "30", "time": "12:12–12:28", "text": "I am moving the cursor back to the Explorer panel on the left and double-clicking flags.py to bring the flags.py tab forward in the editor panel."}, {"type": "row", "id": "31", "time": "12:28–12:45", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to line 78 of flags.py, the raise NotImplementedError placeholder line inside register_flag."}, {"type": "code", "label": "Part 1, lines 78-81: validate rule presence, name, and rollout_percentage bounds", "code": "78        if rule is None or not rule.name:\n79            raise ValueError(\"invalid flag rule\")\n80        if rule.rollout_percentage < 0 or rule.rollout_percentage > 100:\n81            raise ValueError(\"invalid rollout percentage\")"}, {"type": "row", "id": "32", "time": "12:45–12:56", "text": "I am cutting line 78 with Command X and typing lines 78 to 81, the first part of register_flag."}, {"type": "row", "id": "33", "time": "12:56–13:27", "text": "I am moving the cursor from line 78 down to line 81. <mark class=\"hl\">Lines 78 and 79 check whether rule is None or rule.name is empty, raising a ValueError before acquiring the lock. Lines 80 and 81 verify that rule.rollout_percentage sits between zero and one hundred inclusive, rejecting out-of-range percentages with a ValueError.</mark>"}, {"type": "code", "label": "Part 2, lines 82-85: copy override sets and store rule under lock", "code": "82        with self._lock:\n83            rule.allowed_users = set(rule.allowed_users)\n84            rule.blocked_users = set(rule.blocked_users)\n85            self.flags[rule.name] = rule"}, {"type": "row", "id": "34", "time": "13:27–13:40", "text": "I am moving the cursor down to line 82 and typing lines 82 to 85, the second and last part of register_flag."}, {"type": "row", "id": "35", "time": "13:40–14:11", "text": "I am moving the cursor from line 82 down to line 85. <mark class=\"hl\">Line 82 acquires self._lock. Lines 83 and 84 replace rule.allowed_users and rule.blocked_users with fresh set copies so mutating caller sets outside the engine never alters stored rules. Line 85 stores the rule in the self.flags dictionary keyed by rule.name.</mark>"}]}, {"name": "Writing is_enabled (12 lines)", "items": [{"type": "code", "label": "Whole method, lines 87-100 (reference, for the indentation)", "code": "87    def is_enabled(self, flag_name: str, user_id: str) -> bool:\n88        \"\"\"Evaluate whether flag_name is enabled for user_id and record stats.\"\"\"\n89        if not flag_name or not user_id:\n90            raise ValueError(\"flag_name and user_id are required\")\n91        with self._lock:\n92            rule = self.flags.get(flag_name)\n93            if rule is None or not rule.enabled:\n94                return self._record(False)\n95            if user_id in rule.blocked_users:\n96                return self._record(False)\n97            if user_id in rule.allowed_users:\n98                return self._record(True)\n99            bucket = self._compute_bucket(flag_name, user_id)\n100            return self._record(bucket < rule.rollout_percentage)"}, {"type": "row", "id": "36", "time": "14:11–14:31", "text": "I am moving the cursor from line 85 down to line 89, the raise NotImplementedError placeholder line inside is_enabled. Writing register_flag shifted the placeholder down by seven lines, from line 82 to line 89."}, {"type": "code", "label": "Part 1, lines 89-94: validate arguments, acquire lock, look up rule, and check global state", "code": "89        if not flag_name or not user_id:\n90            raise ValueError(\"flag_name and user_id are required\")\n91        with self._lock:\n92            rule = self.flags.get(flag_name)\n93            if rule is None or not rule.enabled:\n94                return self._record(False)"}, {"type": "row", "id": "37", "time": "14:31–14:42", "text": "I am cutting line 89 with Command X and typing lines 89 to 94, the first part of is_enabled."}, {"type": "row", "id": "38", "time": "14:42–15:20", "text": "I am moving the cursor from line 89 down to line 94. <mark class=\"hl\">Lines 89 and 90 check that both flag_name and user_id are non-empty strings, raising a ValueError when either identifier is missing. Line 91 acquires self._lock, line 92 looks up the rule in self.flags, and lines 93 and 94 record and return False immediately when the flag is unregistered or globally disabled.</mark>"}, {"type": "code", "label": "Part 2, lines 95-100: check blocked and allowed overrides, compute rollout bucket, and record decision", "code": "95            if user_id in rule.blocked_users:\n96                return self._record(False)\n97            if user_id in rule.allowed_users:\n98                return self._record(True)\n99            bucket = self._compute_bucket(flag_name, user_id)\n100            return self._record(bucket < rule.rollout_percentage)"}, {"type": "row", "id": "39", "time": "15:20–15:37", "text": "I am moving the cursor down to line 95, typing lines 95 to 100, the second and last part of is_enabled, and pressing Command S to save flags.py."}, {"type": "row", "id": "40", "time": "15:37–16:24", "text": "I am moving the cursor from line 95 down to line 100. <mark class=\"hl\">Lines 95 and 96 check whether user_id is in rule.blocked_users first, recording and returning False so block rules always take priority over allow rules. Lines 97 and 98 check rule.allowed_users and record and return True for explicitly permitted users. Line 99 calls self._compute_bucket(flag_name, user_id) to get the deterministic bucket in zero to ninety-nine, and line 100 records and returns True when bucket is strictly less than rule.rollout_percentage.</mark>"}]}]}, {"part": "PART 4", "title": "Run the Tests → Epilogue", "groups": [{"name": "Run the tests", "items": [{"type": "row", "id": "41", "time": "16:24–16:49", "text": "I am moving the cursor to the menu bar at the top of the screen and clicking Terminal, then clicking New Terminal. The integrated terminal panel opens at the bottom of the Visual Studio Code window in the feature-flag-engine root folder."}, {"type": "row", "id": "42", "time": "16:49–17:07", "text": "I am moving the cursor from the terminal panel at the bottom up to the Explorer panel on the left and double-clicking README.md, to view the test command in README.md."}, {"type": "row", "id": "43", "time": "17:07–17:29", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the README.md tab, and scrolling down to line 31, the Running heading, where line 33 holds the pytest command."}, {"type": "row", "id": "44", "time": "17:29–18:11", "text": "I am moving the cursor to the start of line 33 in README.md, dragging the cursor across to the end of dash v to select the entire command python3 -m pytest test_flags.py -v, and pressing Command C to copy. I am moving the cursor down to the terminal prompt in the terminal panel at the bottom of Visual Studio Code, pressing Command V to paste the command, and pressing Enter."}, {"type": "row", "id": "45", "time": "18:11–18:25", "text": "<mark class=\"hl\">Running pytest via python3 -m pytest invokes the test runner from the active Python 3 interpreter and executes all ten unit tests in test_flags.py.</mark>"}, {"type": "row", "id": "46", "time": "18:25–18:58", "text": "I am scrolling in the terminal panel at the bottom of Visual Studio Code from the top of the pytest output down to the summary line, which reads 10 passed. <mark class=\"hl\">All ten unit tests pass, confirming global flag toggles, blocked and allowed user overrides, deterministic SHA-256 rollout bucketing, monotonic rollout expansion, and thread-safe evaluation counters.</mark>"}]}, {"name": "Epilogue", "items": [{"type": "row", "id": "47", "time": "18:58–19:30", "text": "<mark class=\"hl\">In this session, I completed the in-memory FeatureFlagEngine by implementing register_flag on lines 76 to 85 and is_enabled on lines 87 to 100 of flags.py. The register_flag method validates the rule name and rollout percentage bounds before acquiring the reentrant lock and storing defensive copies of the allowed and blocked user override sets.</mark>"}, {"type": "row", "id": "48", "time": "19:30–20:13", "text": "<mark class=\"hl\">The is_enabled method evaluates rules in strict priority order: missing or globally disabled flags return False immediately, blocked users are rejected before allowed users are granted access, and remaining users are mapped via SHA-256 hashing into a deterministic bucket from zero to ninety-nine. Because the bucket depends only on the flag name and user identifier, a user receives a consistent experience across requests and remains enabled whenever the rollout percentage increases.</mark>"}, {"type": "row", "id": "49", "time": "20:13–20:47", "text": "<mark class=\"hl\">A single reentrant lock protects flag updates, rule lookups, and EvaluationStats counters so concurrent threads never observe partial updates or torn metrics. With more time for a production experimentation platform, I would add attribute-based targeting rules for regions or app versions, multivariate string or JSON flag payloads, and an event listener hook to stream evaluation telemetry asynchronously.</mark>"}]}]}];
var main=document.getElementById('main'),nav=document.getElementById('nav');
var done={},size=26,rows=[];
function load(){try{done=JSON.parse(localStorage.getItem('ffe_done')||'{}');size=+localStorage.getItem('ffe_size')||26}catch(e){}}
function save(){try{localStorage.setItem('ffe_done',JSON.stringify(done));localStorage.setItem('ffe_size',size)}catch(e){}}
function setSize(){document.documentElement.style.setProperty('--size',size+'px')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
load();setSize();
DATA.forEach(function(p,pi){
  var sec=el('section','part');sec.id='part'+(pi+1);
  sec.appendChild(el('h2',null,p.part));sec.appendChild(el('p',null,p.title));
  var b=el('button',null,p.part.replace(/PART /i,'P'));b.setAttribute('aria-label','Go to '+p.part);
  b.onclick=function(){sec.scrollIntoView({behavior:'auto',block:'start'})};nav.appendChild(b);
  p.groups.forEach(function(g){
    sec.appendChild(el('div','group',g.name));
    (g.items||[]).forEach(function(it){
      if(it.type==='code'){
        var sn=el('div','snippet');
        sn.appendChild(el('div','label',it.label));
        var pre=document.createElement('pre');pre.textContent=it.code;
        sn.appendChild(pre);
        sec.appendChild(sn);
        return;
      }
      var r=it;
      var key=p.part+':'+r.id;
      var d=el('div','row');d.tabIndex=0;d.setAttribute('role','button');d.dataset.key=key;
      var timeEl=el('div','time',r.time);
      var textEl=document.createElement('div');textEl.className='text';textEl.innerHTML=r.text;
      d.appendChild(timeEl);d.appendChild(textEl);
      d.onclick=function(){toggle(key)};
      d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(key)}};
      sec.appendChild(d);rows.push({k:key,e:d});
    });
  });
  main.appendChild(sec);
});
function paint(){var cur=null;rows.forEach(function(r){var dn=!!done[r.k];r.e.classList.toggle('done',dn);r.e.setAttribute('aria-pressed',dn);r.e.classList.remove('current');if(!dn&&!cur)cur=r});if(cur)cur.e.classList.add('current');return cur}
function toggle(k){done[k]=!done[k];if(!done[k])delete done[k];save();var c=paint();if(done[k]&&c)c.e.scrollIntoView({behavior:'auto',block:'center'})}
document.getElementById('bigger').onclick=function(){size=Math.min(52,size+3);setSize();save()};
document.getElementById('smaller').onclick=function(){size=Math.max(16,size-3);setSize();save()};
document.getElementById('reset').onclick=function(){done={};save();paint();window.scrollTo(0,0)};
var c0=paint();if(c0&&Object.keys(done).length)c0.e.scrollIntoView({behavior:'auto',block:'center'});
</script>
