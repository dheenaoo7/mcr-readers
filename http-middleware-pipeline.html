<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#14202B; --mute:#5E6E7B; --line:#D5DDE3;
  --accent:#0B7A75; --accent-soft:#D8EFEC; --done:#9AA8B3;
  --hl-bg:#FCE588; --hl-ink:#3A2E00; --code-bg:#E8EEF1; --code-ink:#1B2A35;
  --font-body:"Atkinson Hyperlegible",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --size:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;

:root[data-theme="dark"]{
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;flex:1 1 140px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.size{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.legend{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.legend .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--hl-bg)}
main{max-width:1000px;margin:0 auto}
.part{margin-top:36px}
.part>h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 4px}
.part>p{margin:0 0 6px;color:var(--mute);font-size:15px}
.group{margin:26px 0 8px;font-size:15px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:18px;padding:16px 12px;border-radius:8px;cursor:pointer;scroll-margin-top:90px}
.row+.row{border-top:1px solid var(--line)}
.time{font-family:var(--font-mono);font-size:15px;color:var(--mute);padding-top:.5em;overflow-wrap:anywhere}
.text{font-size:var(--size);line-height:1.5;max-width:44em;overflow-wrap:break-word}
.text mark.hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:.15em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.row.current{background:var(--accent-soft);border-top-color:transparent}
.row.current .time{color:var(--accent)}
.row.done .text{color:var(--done)}
.row.done .text mark.hl{background:transparent;color:inherit;padding:0}
.row.done .time{color:var(--done)}
.snippet{margin:14px 0 18px;scroll-margin-top:90px}
.snippet .label{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 6px}
.snippet pre{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:4px}.time{padding-top:0}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>

am pointing at the bottom corner of the Rate Limit OK diamond and dragging the blue arrow down onto the new rectangle. I am double-clicking the arrow and typing Yes, then double-clicking inside the rectangle and typing Execute Target Handler."}, {"type": "row", "id": "16", "time": "5:12–5:30", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the Execute Target Handler rectangle, to represent the reverse response flow through middleware."}, {"type": "row", "id": "17", "time": "5:30–5:52", "text": "I am pointing at the bottom edge of the Execute Target Handler rectangle and dragging the blue arrow down onto the new rectangle. I am double-clicking inside the rectangle and typing Unwind Middlewares In Reverse."}, {"type": "row", "id": "18", "time": "5:52–6:09", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position directly below Unwind Middlewares In Reverse, to place the final response exit."}, {"type": "row", "id": "19", "time": "6:09–6:31", "text": "I am pointing at the bottom edge of the Unwind Middlewares In Reverse rectangle and dragging the blue arrow down onto the rounded rectangle. I am double-clicking inside the rounded rectangle and typing Return Response."}, {"type": "row", "id": "20", "time": "6:31–6:47", "text": "I am pointing at the bottom edge of the Return 401 Unauthorized shape and dragging the blue arrow down to connect directly to the Return Response shape."}, {"type": "row", "id": "21", "time": "6:47–7:04", "text": "I am pointing at the bottom edge of the Return 429 Too Many Requests shape and dragging the blue arrow down to connect directly to the Return Response shape."}, {"type": "row", "id": "22", "time": "7:04–7:56", "text": "<mark class=\"hl\">I am tracing the completed flowchart from Receive Request at the top down to Return Response at the bottom. An incoming request checks authentication first. If invalid, it short-circuits immediately with a 401 response without running downstream components. If valid, it checks rate limits, exiting early with a 429 if the client is throttled. Once all middleware checks pass, the target handler executes, and the response travels back through the middleware chain in reverse order to apply headers and logging before returning to the caller.</mark>"}]}, {"name": "Switch to VS Code", "items": [{"type": "row", "id": "23", "time": "7:56–8:11", "text": "I am moving the cursor to the top-left corner of the Brave Browser window and clicking the yellow minimize button to hide draw.io."}, {"type": "row", "id": "24", "time": "8:11–8:31", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the dock icon for Visual Studio Code, to bring Visual Studio Code forward for the coding walkthrough."}]}]}, {"part": "PART 2", "title": "VS Code Project Tour", "groups": [{"name": "Project layout", "items": [{"type": "row", "id": "25", "time": "8:31–8:56", "text": "Visual Studio Code is open, with the Explorer panel on the left and the editor panel on the right. In the Explorer panel I am expanding the root folder named http-middleware-pipeline, which holds pipeline.py, README.md, and test_pipeline.py."}, {"type": "row", "id": "26", "time": "8:56–9:21", "text": "<mark class=\"hl\">The project keeps a flat Python layout with no nested packages. The implementation sits in pipeline.py and the test suite sits right next to it in test_pipeline.py, so pytest discovers all test cases from the root directory with zero configuration.</mark>"}]}, {"name": "pipeline.py: data records, types, and Pipeline class", "items": [{"type": "row", "id": "27", "time": "9:21–9:38", "text": "I am moving the cursor to pipeline.py, the first file in the Explorer panel on the left, and double-clicking to open pipeline.py in the editor panel."}, {"type": "row", "id": "28", "time": "9:38–10:16", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the pipeline.py tab, line 16, the Request dataclass, and down to lines 19 to 22.  <mark class=\"hl\">Lines 19 to 22 define the incoming request fields: the endpoint path string, the HTTP method defaulting to GET, a dictionary for headers, and a string for the request body.</mark>"}, {"type": "row", "id": "29", "time": "10:16–11:03", "text": "I am moving the cursor down to line 26, the Response dataclass, lines 29 to 31, and then lines 34 and 35.  <mark class=\"hl\">Line 29 holds the integer status code defaulting to 200, followed by the response headers dictionary on line 30 and the body string on line 31. Lines 34 and 35 define the core type aliases: Handler takes a Request and returns a Response, while Middleware takes a Request and the next Handler callable to return a Response.</mark>"}, {"type": "row", "id": "30", "time": "11:03–11:29", "text": "I am moving the cursor down to line 39, the PipelineStats record, and down to lines 42 to 44.  <mark class=\"hl\">Lines 42 to 44 define the three immutable metrics: total requests handled, short-circuited requests that exited before the target handler, and caught error counts.</mark>"}, {"type": "row", "id": "31", "time": "11:29–12:28", "text": "I am moving the cursor down to line 47, the Pipeline class, then into the constructor on line 50, down to lines 55 to 63, and on to line 65.  <mark class=\"hl\">Line 55 validates that the target handler is not None. Line 58 stores the list of middleware components. Line 60 initializes a reentrant lock, self._lock, to ensure thread-safe metric updates and chain assembly. Lines 61 to 63 initialize all three metrics to zero. Line 65 is add_middleware, which appends a middleware to the list and resets the compiled chain under the lock on lines 69 to 71.</mark>"}]}, {"name": "test_pipeline.py: test suite overview", "items": [{"type": "row", "id": "32", "time": "12:28–12:47", "text": "I am moving the cursor from the editor panel back to the Explorer panel on the left and double-clicking test_pipeline.py, the third file in the list, to open test_pipeline.py."}, {"type": "row", "id": "33", "time": "12:47–13:37", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the test_pipeline.py tab, line 10, echo_handler, then line 19, auth_middleware, and line 27, rate_limit_middleware.  <mark class=\"hl\">Line 10 provides a standard target handler echoing the request body. Line 19 is auth_middleware, which inspects the Authorization header on line 21, returning a 401 on line 23 if invalid. Line 27 is rate_limit_middleware, which checks the client identifier on line 29 and returns a 429 on line 31 if throttled.</mark>"}, {"type": "row", "id": "34", "time": "13:37–14:13", "text": "I am scrolling down in the editor panel to line 88, test_short_circuit_aborts_downstream_execution, and down to line 169.  <mark class=\"hl\">The test on line 88 verifies that an unauthorized request short-circuits without calling downstream middleware or the target handler. Down on line 169, test_concurrent_requests spawns ten threads sending five hundred requests simultaneously, verifying thread safety and exact metric accuracy under concurrent execution.</mark>"}]}]}, {"part": "PART 3", "title": "Implement build_chain", "groups": [{"name": "Preview and write build_chain", "items": [{"type": "row", "id": "35", "time": "14:13–14:30", "text": "I am moving the cursor back to the Explorer panel on the left and double-clicking pipeline.py, which brings the pipeline.py tab forward in the editor panel."}, {"type": "code", "label": "Whole method body (reference): build_chain, lines 82-92", "code": "82    def build_chain(self) -> Handler:\n83        \"\"\"Compose middleware around target handler into a single callable.\"\"\"\n84        with self._lock:\n85            def wrap(mw: Middleware, next_fn: Handler) -> Handler:\n86                return lambda req: mw(req, next_fn)\n87\n88            chain = self.target_handler\n89            for mw in reversed(self.middlewares):\n90                chain = wrap(mw, chain)\n91            self._chain = chain\n92            return chain"}, {"type": "row", "id": "36", "time": "14:30–14:55", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to line 84 of pipeline.py, the placeholder line inside build_chain ending in the word TODO. The def line for build_chain is line 82 just above."}, {"type": "code", "label": "build_chain Part 1 (lines 84-86): lock and wrap helper closure", "code": "84        with self._lock:\n85            def wrap(mw: Middleware, next_fn: Handler) -> Handler:\n86                return lambda req: mw(req, next_fn)"}, {"type": "row", "id": "37", "time": "14:55–15:09", "text": "I am selecting line 84, pressing Command X to remove the placeholder line, and typing lines 84 to 86, the first part of build_chain."}, {"type": "row", "id": "38", "time": "15:09–15:55", "text": "I am moving the cursor from line 84 down to line 86.  <mark class=\"hl\">Line 84 acquires the reentrant lock to ensure thread safety while constructing the pipeline. Lines 85 and 86 define a wrap helper function that takes a middleware callable and the next handler in line, returning a new closure that invokes the middleware with the request and that next handler. Using a separate helper function creates a fresh scope, avoiding late-binding closure pitfalls in Python.</mark>"}, {"type": "code", "label": "build_chain Part 2 (lines 88-92): reverse loop, compose chain, store and return", "code": "88            chain = self.target_handler\n89            for mw in reversed(self.middlewares):\n90                chain = wrap(mw, chain)\n91            self._chain = chain\n92            return chain"}, {"type": "row", "id": "39", "time": "15:55–16:07", "text": "I am moving the cursor down to line 88 and typing lines 88 to 92, the second part of build_chain."}, {"type": "row", "id": "40", "time": "16:07–16:53", "text": "I am moving the cursor from line 88 down to line 92.  <mark class=\"hl\">Line 88 initializes chain to self.target_handler. Lines 89 and 90 loop over self.middlewares in reverse order, wrapping each middleware around the existing chain using wrap. Line 91 caches the composed callable in self._chain, and line 92 returns it. Reversing the loop produces an onion architecture where the first registered middleware executes first on request entry, and unwinds last on response return.</mark>"}]}]}, {"part": "PART 4", "title": "Implement handle", "groups": [{"name": "Preview and write handle", "items": [{"type": "code", "label": "Whole method body (reference): handle, lines 94-113", "code": "94    def handle(self, request: Request) -> Response:\n95        \"\"\"Run request through chain, catch exceptions, and record metrics.\"\"\"\n96        if request is None:\n97            raise ValueError(\"request cannot be None\")\n98        with self._lock:\n99            if self._chain is None:\n100                self.build_chain()\n101            chain = self._chain\n102\n103        try:\n104            response = chain(request)\n105            with self._lock:\n106                self._requests_handled += 1\n107                if response.status_code in (401, 403, 429) or response.headers.get(\"X-Short-Circuit\") == \"true\":\n108                    self._short_circuits += 1\n109            return response\n110        except Exception as exc:\n111            with self._lock:\n112                self._errors += 1\n113            return Response(status_code=500, body=f\"Internal Server Error: {exc}\")"}, {"type": "row", "id": "41", "time": "16:53–17:23", "text": "I am moving the cursor from line 92 down to line 96, the placeholder line inside handle that ends in the word TODO. Writing build_chain expanded the file by eight lines, moving handle down from line 88 to line 96. The def line for handle is line 94 just above."}, {"type": "code", "label": "handle Part 1 (lines 96-101): input validation and chain acquisition", "code": "96        if request is None:\n97            raise ValueError(\"request cannot be None\")\n98        with self._lock:\n99            if self._chain is None:\n100                self.build_chain()\n101            chain = self._chain"}, {"type": "row", "id": "42", "time": "17:23–17:36", "text": "I am selecting line 96, cutting it with Command X, and writing lines 96 to 101, the first part of handle."}, {"type": "row", "id": "43", "time": "17:36–18:11", "text": "I am moving the cursor from line 96 down to line 101.  <mark class=\"hl\">Lines 96 and 97 reject a None request immediately by raising a ValueError. Lines 98 to 101 enter the reentrant lock, lazily compiling the pipeline chain on line 100 if it has not been built yet, and capturing a reference to self._chain on line 101.</mark>"}, {"type": "code", "label": "handle Part 2 (lines 103-109): dispatch chain, record handled and short-circuited counts", "code": "103        try:\n104            response = chain(request)\n105            with self._lock:\n106                self._requests_handled += 1\n107                if response.status_code in (401, 403, 429) or response.headers.get(\"X-Short-Circuit\") == \"true\":\n108                    self._short_circuits += 1\n109            return response"}, {"type": "row", "id": "44", "time": "18:11–18:23", "text": "I am moving the cursor down to line 103 and typing lines 103 to 109, the second part of handle."}, {"type": "row", "id": "45", "time": "18:23–19:15", "text": "I am moving the cursor from line 103 down to line 109.  <mark class=\"hl\">Line 103 begins a try block and line 104 dispatches the request through the chain outside the lock, allowing concurrent requests to run without contention. Under the lock on lines 105 and 106, we increment self._requests_handled. Lines 107 and 108 inspect the response status code, incrementing self._short_circuits if the response was short-circuited by a 401, 403, or 429 status, or by an explicit short-circuit header. Line 109 returns the response.</mark>"}, {"type": "code", "label": "handle Part 3 (lines 110-113): exception barrier, record errors and return 500", "code": "110        except Exception as exc:\n111            with self._lock:\n112                self._errors += 1\n113            return Response(status_code=500, body=f\"Internal Server Error: {exc}\")"}, {"type": "row", "id": "46", "time": "19:15–19:27", "text": "I am moving the cursor down to line 110 and typing lines 110 to 113, the third part of handle."}, {"type": "row", "id": "47", "time": "19:27–20:05", "text": "I am moving the cursor from line 110 down to line 113.  <mark class=\"hl\">Line 110 catches any unhandled exception raised by middleware or the target handler. Under the lock on lines 111 and 112, we increment self._errors so failure metrics remain exact. Line 113 returns an HTTP 500 Response containing the exception message, ensuring a crash never breaks the pipeline or drops client connections.</mark>"}]}]}, {"part": "PART 5", "title": "Run the Tests", "groups": [{"name": "Opening terminal and running pytest", "items": [{"type": "row", "id": "48", "time": "20:05–20:25", "text": "I am moving the cursor to the menu bar at the top of the screen and clicking Terminal, then New Terminal. The terminal panel opens at the bottom of the Visual Studio Code window."}, {"type": "row", "id": "49", "time": "20:25–20:47", "text": "I am moving the cursor from the terminal panel at the bottom up to the Explorer panel on the left and double-clicking README.md, the second file in the list, to locate the test command."}, {"type": "row", "id": "50", "time": "20:47–21:16", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the README.md tab, and scrolling down to line 34, the Running heading. Line 36 holds the test command: python three, dash m, pytest, test underscore pipeline dot p y, dash v."}, {"type": "row", "id": "51", "time": "21:16–21:46", "text": "I am moving the cursor from the start of line 36 to the end of dash v and copying the command with Command C. I am moving the cursor down to the prompt in the terminal panel at the bottom of VS Code, pasting with Command V and pressing Enter."}, {"type": "row", "id": "52", "time": "21:46–22:03", "text": "<mark class=\"hl\">The command runs pytest as a module of Python 3, ensuring it uses the site-packages environment on this machine, and executes our ten test cases with verbose output.</mark>"}, {"type": "row", "id": "53", "time": "22:03–22:34", "text": "I am scrolling down in the terminal panel at the bottom to the summary line, which reads 10 passed in 0.02s.  <mark class=\"hl\">All ten unit tests pass, verifying request and response mutations, reverse unwinding order, authentication and rate limit short-circuiting, 500 error conversion, and concurrent execution under heavy thread load.</mark>"}]}]}, {"part": "PART 6", "title": "Epilogue", "groups": [{"name": "Design choices, trade-offs and extensions", "items": [{"type": "row", "id": "54", "time": "22:34–23:31", "text": "<mark class=\"hl\">In this task, I designed and implemented an in-memory HTTP middleware pipeline in Python. We structured the solution around two core methods: build_chain and handle. For build_chain, we chose an onion closure architecture over walking an iterative list of middleware on every request. By iterating through the middleware list in reverse order and wrapping each layer with a helper closure, each middleware receives a clean Handler callable to invoke. This guarantees that request processing flows forward through authentication, rate limiting, and logging, while responses naturally unwind in reverse order after calling the next handler.</mark>"}, {"type": "row", "id": "55", "time": "23:31–24:13", "text": "<mark class=\"hl\">Short-circuiting is a core capability of this design. Any middleware can immediately return an early Response object, such as an HTTP 401 for missing credentials or an HTTP 429 for rate-limited clients, completely bypassing downstream middleware and the core handler. This protects backend business logic from unnecessary compute load while ensuring response headers are preserved. We accurately record short-circuited requests in pipeline statistics alongside total handled counts.</mark>"}, {"type": "row", "id": "56", "time": "24:13–25:03", "text": "<mark class=\"hl\">For concurrency and reliability, we protected internal state and metrics with a reentrant lock, ensuring that thread counters never drift and lazy chain compilation is atomic. Crucially, we execute the chain outside the lock so slow handlers do not serialize request processing. We wrapped execution in an exception barrier that transforms unhandled exceptions into HTTP 500 responses, preventing pipeline crashes. If given more time, I would extend this system with asynchronous asyncio support for high-throughput I/O and add request timeout middleware.</mark>"}]}]}];
var main=document.getElementById('main'),nav=document.getElementById('nav');
var done={},size=26,rows=[];
function load(){try{done=JSON.parse(localStorage.getItem('hmp_done')||'{}');size=+localStorage.getItem('hmp_size')||26}catch(e){}}
function save(){try{localStorage.setItem('hmp_done',JSON.stringify(done));localStorage.setItem('hmp_size',size)}catch(e){}}
function setSize(){document.documentElement.style.setProperty('--size',size+'px')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
load();setSize();
DATA.forEach(function(p,pi){
  var sec=el('section','part');sec.id='part'+(pi+1);
  sec.appendChild(el('h2',null,p.part));sec.appendChild(el('p',null,p.title));
  var b=el('button',null,p.part.replace(/PART /i,'P'));b.setAttribute('aria-label','Go to '+p.part);
  b.onclick=function(){sec.scrollIntoView({behavior:'auto',block:'start'})};nav.appendChild(b);
  p.groups.forEach(function(g){
    sec.appendChild(el('div','group',g.name));
    (g.items||[]).forEach(function(it){
      if(it.type==='code'){
        var sn=el('div','snippet');
        sn.appendChild(el('div','label',it.label));
        var pre=document.createElement('pre');pre.textContent=it.code;
        sn.appendChild(pre);
        sec.appendChild(sn);
        return;
      }
      var r=it;
      var key=p.part+':'+r.id;
      var d=el('div','row');d.tabIndex=0;d.setAttribute('role','button');d.dataset.key=key;
      var timeEl=el('div','time',r.time);
      var textEl=document.createElement('div');textEl.className='text';textEl.innerHTML=r.text;
      d.appendChild(timeEl);d.appendChild(textEl);
      d.onclick=function(){toggle(key)};
      d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(key)}};
      sec.appendChild(d);rows.push({k:key,e:d});
    });
  });
  main.appendChild(sec);
});
function paint(){var cur=null;rows.forEach(function(r){var dn=!!done[r.k];r.e.classList.toggle('done',dn);r.e.setAttribute('aria-pressed',dn);r.e.classList.remove('current');if(!dn&&!cur)cur=r});if(cur)cur.e.classList.add('current');return cur}
function toggle(k){done[k]=!done[k];if(!done[k])delete done[k];save();var c=paint();if(done[k]&&c)c.e.scrollIntoView({behavior:'auto',block:'center'})}
document.getElementById('bigger').onclick=function(){size=Math.min(52,size+3);setSize();save()};
document.getElementById('smaller').onclick=function(){size=Math.max(16,size-3);setSize();save()};
document.getElementById('reset').onclick=function(){done={};save();paint();window.scrollTo(0,0)};
var c0=paint();if(c0&&Object.keys(done).length)c0.e.scrollIntoView({behavior:'auto',block:'center'});
</script>
