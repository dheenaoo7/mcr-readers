<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inventory Reservation Service Reader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#14202B; --mute:#5E6E7B; --line:#D5DDE3;
  --accent:#0B7A75; --accent-soft:#D8EFEC; --done:#9AA8B3;
  --hl-bg:#FCE588; --hl-ink:#3A2E00; --code-bg:#E8EEF1; --code-ink:#1B2A35;
  --font-body:"Atkinson Hyperlegible",system-ui,sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --size:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141A; --panel:#141D25; --ink:#E7EEF3; --mute:#92A3B0; --line:#26323C;
  --accent:#4CC3B8; --accent-soft:#17343A; --done:#566672;
  --hl-bg:#6B5A14; --hl-ink:#FBEFC6; --code-bg:#0A1014; --code-ink:#CFE3EC; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;flex:1 1 140px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.size{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.legend{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.legend .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--hl-bg)}
main{max-width:1000px;margin:0 auto}
.part{margin-top:36px}
.part>h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:0 0 4px}
.part>p{margin:0 0 6px;color:var(--mute);font-size:15px}
.group{margin:26px 0 8px;font-size:15px;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:18px;padding:16px 12px;border-radius:8px;cursor:pointer;scroll-margin-top:90px}
.row+.row{border-top:1px solid var(--line)}
.time{font-family:var(--font-mono);font-size:15px;color:var(--mute);padding-top:.5em;overflow-wrap:anywhere}
.text{font-size:var(--size);line-height:1.5;max-width:44em;overflow-wrap:break-word}
.text mark.hl{background:var(--hl-bg);color:var(--hl-ink);border-radius:.15em;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.row.current{background:var(--accent-soft);border-top-color:transparent}
.row.current .time{color:var(--accent)}
.row.done .text{color:var(--done)}
.row.done .text mark.hl{background:transparent;color:inherit;padding:0}
.row.done .time{color:var(--done)}
.snippet{margin:14px 0 18px;scroll-margin-top:90px}
.snippet .label{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mute);margin:0 0 6px}
.snippet pre{margin:0;padding:14px 16px;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:8px;
  font-family:var(--font-mono);font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:4px}.time{padding-top:0}}
@media(prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>
</head>

var DATA=[{"part": "PART 1", "title": "draw.io Flowchart → Switch to VS Code", "groups": [{"name": "Intro – task PDF", "items": [{"type": "row", "id": "1", "time": "0:00–0:20", "text": "I'll be beginning my task soon. Here is the workflow I've in mind. I am clicking the yellow minimize button in the top-left corner of the Preview window to close the task description."}, {"type": "row", "id": "2", "time": "0:20–0:43", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the fifth icon from the top, the red Brave Browser icon just below the divider line, to open draw.io for the flowchart."}]}, {"name": "Draw.io flowchart", "items": [{"type": "row", "id": "3", "time": "0:43–1:20", "text": "draw.io is open in the Brave browser window. On the empty canvas in the middle I will draw the inventory reservation flowchart, using the plain shapes in the General section of the shape library panel on the left, <mark class=\"hl\">showing how expired holds are swept before checking stock availability, how temporary holds lock units for checkout, and how confirmation permanently deducts inventory.</mark>"}, {"type": "row", "id": "4", "time": "1:20–1:35", "text": "I am dragging a Rectangle from the General section on the left to the top center of the canvas, to place the reservation entry point."}, {"type": "row", "id": "5", "time": "1:35–1:45", "text": "I am double-clicking inside the rectangle at the top of the canvas and typing Reserve Request."}, {"type": "row", "id": "6", "time": "1:45–2:01", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the Reserve Request rectangle, to place the expiration cleanup step."}, {"type": "row", "id": "7", "time": "2:01–2:20", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Reserve Request down onto the new rectangle, then double-clicking inside the rectangle and typing Sweep Expired Holds."}, {"type": "row", "id": "8", "time": "2:20–2:37", "text": "I am dragging a Diamond from the General section on the left to the position directly below the Sweep Expired Holds rectangle, to place the stock availability check."}, {"type": "row", "id": "9", "time": "2:37–2:56", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Sweep Expired Holds down onto the new diamond, then double-clicking inside the diamond and typing Stock Available."}, {"type": "row", "id": "10", "time": "2:56–3:13", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position right of the diamond labelled Stock Available, to place the insufficient stock rejection."}, {"type": "row", "id": "11", "time": "3:13–3:38", "text": "I am dragging the blue arrow from the right corner of the diamond labelled Stock Available onto the new rounded rectangle. I am double-clicking the connector line and typing No, then double-clicking inside the rounded rectangle and typing Reject Insufficient Stock."}, {"type": "row", "id": "12", "time": "3:38–3:55", "text": "I am dragging a Rectangle from the General section on the left to the position directly below the diamond labelled Stock Available, to place the hold creation step."}, {"type": "row", "id": "13", "time": "3:55–4:19", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled Stock Available down onto the new rectangle. I am double-clicking the connector line and typing Yes, then double-clicking inside the rectangle and typing Create Active Hold."}, {"type": "row", "id": "14", "time": "4:19–4:39", "text": "I am dragging a Diamond from the General section on the left to the position directly below the Create Active Hold rectangle, to check whether the hold is still active when confirmation arrives."}, {"type": "row", "id": "15", "time": "4:39–4:59", "text": "I am dragging the blue arrow from the bottom edge of the rectangle labelled Create Active Hold down onto the new diamond, then double-clicking inside the diamond and typing Hold Active At Confirm."}, {"type": "row", "id": "16", "time": "4:59–5:19", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position left of the diamond labelled Hold Active At Confirm, to place the expired or inactive rejection step."}, {"type": "row", "id": "17", "time": "5:19–5:45", "text": "I am dragging the blue arrow from the left corner of the diamond labelled Hold Active At Confirm onto the new rounded rectangle. I am double-clicking the connector line and typing No, then double-clicking inside the rounded rectangle and typing Reject Inactive Hold."}, {"type": "row", "id": "18", "time": "5:45–6:04", "text": "I am dragging a Rounded Rectangle from the General section on the left to the position directly below the diamond labelled Hold Active At Confirm, to place the final stock deduction step."}, {"type": "row", "id": "19", "time": "6:04–6:31", "text": "I am dragging the blue arrow from the bottom corner of the diamond labelled Hold Active At Confirm down onto the final rounded rectangle. I am double-clicking the connector line and typing Yes, then double-clicking inside the rounded rectangle and typing Deduct Stock And Confirm."}, {"type": "row", "id": "20", "time": "6:31–7:11", "text": "I am tracing the flowchart with the cursor from Reserve Request at the top down to Deduct Stock And Confirm at the bottom. <mark class=\"hl\">Every reservation and confirmation first sweeps expired holds so stale checkouts immediately return units to the available pool. When stock is sufficient, an active hold reserves the quantity until checkout either confirms and permanently deducts physical stock or cancels and releases the hold.</mark>"}]}, {"name": "Switch to VS Code", "items": [{"type": "row", "id": "21", "time": "7:11–7:25", "text": "I am moving the cursor to the top-left corner of the Brave Browser window and clicking the yellow minimize button to hide draw.io."}, {"type": "row", "id": "22", "time": "7:25–7:45", "text": "I am moving the cursor to the dock on the right edge of the screen and clicking the dock icon for Visual Studio Code, to open the Python project in Visual Studio Code."}]}]}, {"part": "PART 2", "title": "VS Code Project Tour", "groups": [{"name": "Project layout", "items": [{"type": "row", "id": "23", "time": "7:45–8:14", "text": "Visual Studio Code is open, with the Explorer panel on the left and the editor panel on the right. I am moving the cursor to the Explorer panel on the left and clicking the folder arrow to expand the root folder named inventory-reservation, which holds inventory.py, README.md, and test_inventory.py."}, {"type": "row", "id": "24", "time": "8:14–8:37", "text": "<mark class=\"hl\">The project keeps a flat Python layout, with no nested packages. The implementation sits in inventory.py and the test suite sits next to inventory.py in test_inventory.py, so pytest discovers the tests from the root folder with no extra setup.</mark>"}]}, {"name": "inventory.py: models, helpers, and service class", "items": [{"type": "row", "id": "25", "time": "8:37–8:54", "text": "I am moving the cursor to inventory.py in the Explorer panel on the left and double-clicking inventory.py to open the file in the editor panel on the right."}, {"type": "row", "id": "26", "time": "8:54–9:41", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the inventory.py tab, across lines 14 to 20 for HoldStatus, and down to lines 23 to 40 for the Hold and InventoryStats dataclasses. <mark class=\"hl\">Lines 17 to 20 define the four hold states: ACTIVE, CONFIRMED, CANCELLED, and EXPIRED. Hold on line 24 stores the hold identifier, SKU, reserved quantity, expiration timestamp, and status, while InventoryStats on line 34 holds the four summary counts.</mark>"}, {"type": "row", "id": "27", "time": "9:41–10:30", "text": "I am moving the cursor down to line 43, the InventoryService class, across lines 46 to 62 for initialization and add_stock, and down to lines 64 to 107 for _sweep_expired, available, get_hold, cancel, and stats. <mark class=\"hl\">Lines 47 to 50 initialize the physical stock map, the reserved units map, the holds dictionary, and the reentrant lock self._lock. Line 64 defines _sweep_expired, which marks any active hold with now greater than or equal to expires_at as EXPIRED, subtracts hold.quantity from self.reserved, and increments self._expired.</mark>"}, {"type": "row", "id": "28", "time": "10:30–11:11", "text": "I am moving the cursor down to line 109, the reserve method with the NotImplementedError placeholder on line 111, and down to line 113, the confirm method with the NotImplementedError placeholder on line 115. <mark class=\"hl\">Those two methods are the TODOs we will implement: reserve sweeps expired holds and creates a time-limited stock hold when enough units are free, and confirm commits an active hold and permanently deducts physical stock.</mark>"}]}, {"name": "test_inventory.py: what the tests expect", "items": [{"type": "row", "id": "29", "time": "11:11–11:28", "text": "I am moving the cursor from the editor panel back to the Explorer panel on the left and double-clicking test_inventory.py to open the test suite in the editor panel."}, {"type": "row", "id": "30", "time": "11:28–12:04", "text": "I am moving the cursor to the test_inventory.py tab in the editor panel and scrolling down through the test functions from line 9 to line 145. <mark class=\"hl\">The ten unit tests verify stock holds, insufficient stock rejection, automatic expiration before new reservations, permanent stock deduction on confirm, expired or duplicate confirm rejection, cancellation recovery, multi-SKU isolation, and fifty-thread concurrency without overselling.</mark>"}]}]}, {"part": "PART 3", "title": "Write reserve and confirm (23 lines total)", "groups": [{"name": "Writing reserve (13 lines)", "items": [{"type": "code", "label": "Whole method, lines 109-123 (reference, for the indentation)", "code": "109    def reserve(self, sku: str, quantity: int, ttl: float, now: float) -> Hold:\n110        \"\"\"Place a temporary stock hold if sufficient inventory is available.\"\"\"\n111        if not sku or quantity <= 0 or ttl <= 0:\n112            raise ValueError(\"invalid reservation\")\n113        with self._lock:\n114            self._sweep_expired(now)\n115            free = self.stock.get(sku, 0) - self.reserved.get(sku, 0)\n116            if free < quantity:\n117                raise ValueError(\"insufficient stock\")\n118            self._seq += 1\n119            hold_id = f\"hold-{self._seq}\"\n120            hold = Hold(hold_id, sku, quantity, now + ttl)\n121            self.holds[hold_id] = hold\n122            self.reserved[sku] = self.reserved.get(sku, 0) + quantity\n123            return hold"}, {"type": "row", "id": "31", "time": "12:04–12:20", "text": "I am moving the cursor back to the Explorer panel on the left and double-clicking inventory.py to bring the inventory.py tab forward in the editor panel."}, {"type": "row", "id": "32", "time": "12:20–12:37", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to line 111 of inventory.py, the raise NotImplementedError placeholder line inside reserve."}, {"type": "code", "label": "Part 1, lines 111-117: validate inputs, sweep expired holds under lock, and check available stock", "code": "111        if not sku or quantity <= 0 or ttl <= 0:\n112            raise ValueError(\"invalid reservation\")\n113        with self._lock:\n114            self._sweep_expired(now)\n115            free = self.stock.get(sku, 0) - self.reserved.get(sku, 0)\n116            if free < quantity:\n117                raise ValueError(\"insufficient stock\")"}, {"type": "row", "id": "33", "time": "12:37–12:48", "text": "I am cutting line 111 with Command X and typing lines 111 to 117, the first part of reserve."}, {"type": "row", "id": "34", "time": "12:48–13:27", "text": "I am moving the cursor from line 111 to line 117. <mark class=\"hl\">Lines 111 and 112 reject an empty SKU or a non-positive quantity or TTL with a ValueError before acquiring the lock. Line 113 acquires self._lock, line 114 calls self._sweep_expired(now) to free any expired holds first, and lines 115 to 117 compute the unreserved stock and raise a ValueError if free is less than quantity.</mark>"}, {"type": "code", "label": "Part 2, lines 118-123: allocate hold ID, store Hold record, update reserved count, and return hold", "code": "118            self._seq += 1\n119            hold_id = f\"hold-{self._seq}\"\n120            hold = Hold(hold_id, sku, quantity, now + ttl)\n121            self.holds[hold_id] = hold\n122            self.reserved[sku] = self.reserved.get(sku, 0) + quantity\n123            return hold"}, {"type": "row", "id": "35", "time": "13:27–13:40", "text": "I am moving the cursor down to line 118 and typing lines 118 to 123, the second and last part of reserve."}, {"type": "row", "id": "36", "time": "13:40–14:17", "text": "I am moving the cursor from line 118 down to line 123. <mark class=\"hl\">Lines 118 and 119 increment self._seq and build the sequential hold_id string. Line 120 constructs the Hold record with an expiration timestamp of now plus ttl, line 121 stores the hold in self.holds, line 122 adds quantity to self.reserved for the SKU, and line 123 returns the active hold.</mark>"}]}, {"name": "Writing confirm (10 lines)", "items": [{"type": "code", "label": "Whole method, lines 125-136 (reference, for the indentation)", "code": "125    def confirm(self, hold_id: str, now: float) -> Hold:\n126        \"\"\"Commit an active hold and permanently deduct stock.\"\"\"\n127        with self._lock:\n128            self._sweep_expired(now)\n129            hold = self.holds.get(hold_id)\n130            if hold is None or hold.status != HoldStatus.ACTIVE:\n131                raise ValueError(\"hold not active\")\n132            self.reserved[hold.sku] -= hold.quantity\n133            self.stock[hold.sku] -= hold.quantity\n134            hold.status = HoldStatus.CONFIRMED\n135            self._confirmed += 1\n136            return hold"}, {"type": "row", "id": "37", "time": "14:17–14:37", "text": "I am moving the cursor from line 123 down to line 127, the raise NotImplementedError placeholder line inside confirm. Writing reserve shifted the placeholder down by twelve lines, from line 115 to line 127."}, {"type": "code", "label": "Part 1, lines 127-131: acquire lock, sweep expired holds, and verify the hold is active", "code": "127        with self._lock:\n128            self._sweep_expired(now)\n129            hold = self.holds.get(hold_id)\n130            if hold is None or hold.status != HoldStatus.ACTIVE:\n131                raise ValueError(\"hold not active\")"}, {"type": "row", "id": "38", "time": "14:37–14:48", "text": "I am cutting line 127 with Command X and typing lines 127 to 131, the first part of confirm."}, {"type": "row", "id": "39", "time": "14:48–15:23", "text": "I am moving the cursor from line 127 down to line 131. <mark class=\"hl\">Line 127 acquires self._lock and line 128 runs self._sweep_expired(now) so a hold whose TTL has already passed transitions to EXPIRED before we check status. Lines 129 to 131 look up hold_id in self.holds and raise a ValueError if the hold is missing or no longer ACTIVE.</mark>"}, {"type": "code", "label": "Part 2, lines 132-136: deduct reserved and physical stock, mark CONFIRMED, and return hold", "code": "132            self.reserved[hold.sku] -= hold.quantity\n133            self.stock[hold.sku] -= hold.quantity\n134            hold.status = HoldStatus.CONFIRMED\n135            self._confirmed += 1\n136            return hold"}, {"type": "row", "id": "40", "time": "15:23–15:40", "text": "I am moving the cursor down to line 132, typing lines 132 to 136, the second and last part of confirm, and pressing Command S to save inventory.py."}, {"type": "row", "id": "41", "time": "15:40–16:08", "text": "I am moving the cursor from line 132 down to line 136. <mark class=\"hl\">Line 132 removes hold.quantity from self.reserved and line 133 permanently deducts hold.quantity from self.stock for the SKU. Line 134 updates hold.status to HoldStatus.CONFIRMED, line 135 increments self._confirmed, and line 136 returns the confirmed hold.</mark>"}]}]}, {"part": "PART 4", "title": "Run the Tests → Epilogue", "groups": [{"name": "Run the tests", "items": [{"type": "row", "id": "42", "time": "16:08–16:33", "text": "I am moving the cursor to the menu bar at the top of the screen and clicking Terminal, then clicking New Terminal. The integrated terminal panel opens at the bottom of the Visual Studio Code window in the inventory-reservation root folder."}, {"type": "row", "id": "43", "time": "16:33–16:51", "text": "I am moving the cursor from the terminal panel at the bottom up to the Explorer panel on the left and double-clicking README.md, to view the test command in README.md."}, {"type": "row", "id": "44", "time": "16:51–17:13", "text": "I am moving the cursor from the Explorer panel to the editor panel on the right, to the README.md tab, and scrolling down to line 34, the Running heading, where line 36 holds the pytest command."}, {"type": "row", "id": "45", "time": "17:13–17:55", "text": "I am moving the cursor to the start of line 36 in README.md, dragging the cursor across to the end of dash v to select the entire command python3 -m pytest test_inventory.py -v, and pressing Command C to copy. I am moving the cursor down to the terminal prompt in the terminal panel at the bottom of Visual Studio Code, pressing Command V to paste the command, and pressing Enter."}, {"type": "row", "id": "46", "time": "17:55–18:09", "text": "<mark class=\"hl\">Running pytest via python3 -m pytest invokes the test runner from the active Python 3 interpreter and executes all ten unit tests in test_inventory.py.</mark>"}, {"type": "row", "id": "47", "time": "18:09–18:43", "text": "I am scrolling in the terminal panel at the bottom of Visual Studio Code from the top of the pytest output down to the summary line, which reads 10 passed. <mark class=\"hl\">All ten unit tests pass, confirming temporary stock holds, lazy expiration cleanup, permanent stock deduction on confirm, cancellation recovery, and thread safety under concurrent checkout load.</mark>"}]}, {"name": "Epilogue", "items": [{"type": "row", "id": "48", "time": "18:43–19:17", "text": "<mark class=\"hl\">I have completed the in-memory InventoryService by implementing reserve on lines 109 to 123 and confirm on lines 125 to 136 of inventory.py. We kept physical stock in self.stock and temporary holds in self.reserved so available inventory is always computed accurately as physical stock minus active reserved units without mutating physical stock until a checkout is confirmed.</mark>"}, {"type": "row", "id": "49", "time": "19:17–19:55", "text": "<mark class=\"hl\">Rather than running a background timer thread that wakes up periodically and competes for locks, both reserve and confirm invoke _sweep_expired at the start of each critical section. The lazy expiration design guarantees that any expired hold frees its reserved units immediately before an availability check or confirmation decision is made, keeping state deterministic and easy to test with an explicit clock parameter.</mark>"}, {"type": "row", "id": "50", "time": "19:55–20:35", "text": "<mark class=\"hl\">A single reentrant lock guards expiration sweeps, stock checks, hold state transitions, and InventoryStats counters so concurrent threads racing for the last units of a hot SKU never oversell inventory. With more time for a production deployment, I would index active holds in a min-heap ordered by expires_at so _sweep_expired only inspects holds that have actually expired, and persist state transitions to an append-only transaction log.</mark>"}]}]}];
var main=document.getElementById('main'),nav=document.getElementById('nav');
var done={},size=26,rows=[];
function load(){try{done=JSON.parse(localStorage.getItem('invr_done')||'{}');size=+localStorage.getItem('invr_size')||26}catch(e){}}
function save(){try{localStorage.setItem('invr_done',JSON.stringify(done));localStorage.setItem('invr_size',size)}catch(e){}}
function setSize(){document.documentElement.style.setProperty('--size',size+'px')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
load();setSize();
DATA.forEach(function(p,pi){
  var sec=el('section','part');sec.id='part'+(pi+1);
  sec.appendChild(el('h2',null,p.part));sec.appendChild(el('p',null,p.title));
  var b=el('button',null,p.part.replace(/PART /i,'P'));b.setAttribute('aria-label','Go to '+p.part);
  b.onclick=function(){sec.scrollIntoView({behavior:'auto',block:'start'})};nav.appendChild(b);
  p.groups.forEach(function(g){
    sec.appendChild(el('div','group',g.name));
    (g.items||[]).forEach(function(it){
      if(it.type==='code'){
        var sn=el('div','snippet');
        sn.appendChild(el('div','label',it.label));
        var pre=document.createElement('pre');pre.textContent=it.code;
        sn.appendChild(pre);
        sec.appendChild(sn);
        return;
      }
      var r=it;
      var key=p.part+':'+r.id;
      var d=el('div','row');d.tabIndex=0;d.setAttribute('role','button');d.dataset.key=key;
      var timeEl=el('div','time',r.time);
      var textEl=document.createElement('div');textEl.className='text';textEl.innerHTML=r.text;
      d.appendChild(timeEl);d.appendChild(textEl);
      d.onclick=function(){toggle(key)};
      d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(key)}};
      sec.appendChild(d);rows.push({k:key,e:d});
    });
  });
  main.appendChild(sec);
});
function paint(){var cur=null;rows.forEach(function(r){var dn=!!done[r.k];r.e.classList.toggle('done',dn);r.e.setAttribute('aria-pressed',dn);r.e.classList.remove('current');if(!dn&&!cur)cur=r});if(cur)cur.e.classList.add('current');return cur}
function toggle(k){done[k]=!done[k];if(!done[k])delete done[k];save();var c=paint();if(done[k]&&c)c.e.scrollIntoView({behavior:'auto',block:'center'})}
document.getElementById('bigger').onclick=function(){size=Math.min(52,size+3);setSize();save()};
document.getElementById('smaller').onclick=function(){size=Math.max(16,size-3);setSize();save()};
document.getElementById('reset').onclick=function(){done={};save();paint();window.scrollTo(0,0)};
var c0=paint();if(c0&&Object.keys(done).length)c0.e.scrollIntoView({behavior:'auto',block:'center'});
</script>
